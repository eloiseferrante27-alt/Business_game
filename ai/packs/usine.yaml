# Départements (cahier §1 et image « Chaque département a ses agents ») : 8 dans l'usine, 2 externes, plus le quai
# partagé, zone sans agent ni poste (annexe §5, 29/10). area = x_min, z_min, x_max, z_max (m).
# Un agent parlant par département du cahier ; `facts` = clé de engine._FACTS (à
# écrire par moteur-jeu, étape 6) ; le commentaire « dit » liste les faits attendus, tous calculés par le moteur
# (aucun chiffre inventé), une ou deux phrases chacun. Le placeur pose les éléments selon le `block` du
# département (bord, rayonnages, ligne, site), leur `role` et `front` ; une zone externe déclare `site` au lieu
# de `area`. Il trace la zone (prop_floor_zone, ref dept:<id>) et place les lignes dans `production`. `ref: mp`
# désigne mp:<id de la MP> (un seul article en tranche 1).
departments:
  - id: fournisseur
    label: Fournisseur de matière première
    external: true
    block: site
    site: fournisseur_standard   # agent parlant du fournisseur standard ; les sites rapide et économique n'en ont pas
    stations: []
    elements:   # le bâtiment est celui du site (network.sites.*.building)
      - {asset: prop_pallet_stack, label: Palettes prêtes, role: decor, count: 2}
    agent:
      name: Paul
      job: Commercial du fournisseur
      character: char_manager_m
      facts: usine_fournisseur
      # dit : commandes en cours (palettes, jour de livraison prévu, créneau 8 h - 10 h) ; retard annoncé d'une
      # livraison (urgent) ; hausse de prix en cours ; réclamation reçue pour une palette non conforme.
      tasks: [recevoir les commandes de l'usine, préparer les palettes, envoyer le camion avec le bon de livraison]
      notions: [delai_et_fiabilite]
  - id: reception
    label: Réception
    area: [-24, 6, -8.5, 15]
    block: bord
    front: nord
    stations: [{kind: poste_reception, label: Poste de contrôle de la réception}]
    elements:
      - {asset: prop_floor_zone, label: Zone de dépose (6 palettes), role: tampon}
      - {asset: prop_floor_zone, label: Quarantaine (2 palettes), ref: quarantine, role: stockage}
      - {asset: prop_desk_computer, label: "Poste de contrôle : PC, lecteur, imprimante d'étiquettes", role: poste}
      - {asset: veh_pallet_jack, label: Transpalette (2 000 kg), role: engin}
    agent:
      name: Noah
      job: Réceptionnaire
      character: char_worker_m
      facts: usine_reception
      # dit : palettes reçues au dernier tour et mises en quarantaine (urgent si > 0) ; attente d'un camion au quai
      # (minutes) ; prochaine livraison attendue (jour, palettes).
      tasks: [décharger les camions, contrôler et étiqueter les palettes, mettre les non-conformes en quarantaine et prévenir le pilotage]
      notions: [delai_et_fiabilite]
  - id: stock_mp
    label: Stock de matière première
    area: [-24, -15, -14, 3]
    block: racks
    front: est
    capacity: mp_capacity_pallets   # ⌈24 / 6⌉ = 4 racks
    stations: [{kind: magasin_mp, label: Bureau du magasin MP}]
    elements:
      # 6 places par rack : 2 travées de 3 palettes Europe, un niveau montré ; indicatif (calibre)
      - {asset: prop_pallet_rack, label: Racks à palettes (24 emplacements), ref: mp, role: stockage, per: places, places: 6}
      - {asset: prop_floor_zone, label: Préparation des kits, role: tampon}
      - {asset: veh_forklift, label: Chariot élévateur (1 200 kg), role: engin}
    agent:
      name: Inès
      job: Magasinière-cariste
      character: char_worker_f
      facts: usine_stock_mp
      # dit : stock MP en palettes et places libres ; sous le point de commande, commandes en cours comprises
      # (urgent) ; kits livrés et minutes de ligne arrêtée faute de matière au dernier tour (urgent si > 0).
      tasks: [ranger les palettes reçues, sortir la matière dans l'ordre d'arrivée, préparer et livrer le kit de chaque OF, signaler le stock sous le point de commande]
      notions: [point_de_commande, stock_de_securite, rotation_fifo]
  - id: production
    label: Production
    area: [-11, -8.5, 11, 3]
    block: ligne
    front: sud
    stations: [{kind: tableau_ligne, label: Tableau de ligne}]   # postes `machine` : un par machine, créés par la génération
    elements:
      - {asset: prop_machine, label: Machine, role: machine, per: machine}
      - {asset: prop_buffer_table, label: Table d'attente (10 produits), role: tampon, per: machine}
      - {asset: prop_wall_board, label: "Tableau de ligne : OF en cours, cadence, arrêts", role: affichage}
      - {asset: prop_andon_light, label: Andon de la ligne, role: affichage, per: line}
    agent:
      name: Idriss
      job: Chef de ligne
      character: char_worker_m
      module: production
      facts: usine_production
      # dit : par ligne, bons par heure mesurés et attendus ; machine goulot et ses minutes perdues (panne, attente
      # matière, sortie pleine, pause) au dernier tour (urgent si le goulot a perdu du temps) ; OF en cours.
      tasks: [lancer les OF sur les lignes, suivre la cadence et les arrêts, relayer l'opérateur du goulot pendant les pauses, appeler la maintenance]
      notions: [goulot, tampon_avant_goulot, rendement_en_cascade, changement_de_serie]
  - id: qualite
    label: Contrôle qualité
    area: [14, -15, 24, -4.5]
    block: bord
    front: ouest
    stations: [{kind: poste_qualite, label: Table de contrôle}]
    elements:
      - {asset: prop_inspection_table, label: Table de contrôle et instruments, ref: quality, role: poste}
      - {asset: prop_floor_zone, label: Zone conforme, role: tampon}
      - {asset: prop_floor_zone, label: Zone à retoucher, role: tampon}
      - {asset: prop_scrap_bin, label: Bac à rebut, ref: scrap, role: stockage}
    agent:
      name: Léa
      job: Contrôleuse qualité
      character: char_worker_f
      facts: usine_qualite
      # dit : produits contrôlés et rebutés au dernier tour, part de bons mesurée et attendue (rendement cumulé ;
      # urgent si mesurée < attendue de plus de 2 points) ; produits en attente de contrôle.
      tasks: [contrôler chaque produit en sortie de ligne, trier conformes et rebuts, prévenir le chef de ligne quand le rebut grimpe]
      notions: [rendement_en_cascade, carte_p]
  - id: emballage
    label: Emballage
    area: [14, -2, 24, 3]   # 10 x 5 m : table, filmeuse et palette tiennent ; 2 m rendus à l'entrepôt PF
    block: bord
    front: ouest
    stations: [{kind: poste_emballage, label: Table d'emballage}]
    elements:
      - {asset: prop_packing_table, label: "Table d'emballage : cartons, ruban, balance", role: poste}
      - {asset: prop_pallet_wrapper, label: Filmeuse de palettes, role: machine}
      - {asset: prop_pallet, label: Palette en cours, role: tampon}
    agent:
      name: Malik
      job: Emballeur
      character: char_worker_m
      facts: usine_emballage
      # dit : colis et palettes faits au dernier tour ; produits conformes en attente d'emballage (urgent au-delà de
      # 2 palettes).
      tasks: [mettre 4 produits par carton, étiqueter et peser, monter et filmer les palettes, les envoyer à l'entrepôt]
      notions: [loi_de_little]
  - id: maintenance
    label: Maintenance et pièces de rechange
    area: [-11, -15, -1, -11.5]
    block: bord
    front: sud
    stations: [{kind: maintenance, label: Établi de maintenance}]
    elements:
      - {asset: prop_workbench, label: Établi et servante d'outils, role: poste}
      - {asset: prop_wall_board, label: Tableau des interventions, role: affichage}
    agent:
      name: Karim
      job: Technicien de maintenance
      character: char_worker_m
      module: maintenance
      facts: usine_maintenance
      # dit : pannes et minutes d'arrêt au dernier tour, machine la plus touchée (urgent si c'est un goulot) ;
      # disponibilité mesurée du goulot de chaque ligne ; pannes qui ont attendu le technicien (nombre, minutes) ;
      # préventifs faits.
      tasks: [aller réparer les machines en panne, faire le préventif pendant les pauses, tenir le tableau des interventions]
      notions: [disponibilite, pannes_par_usure, maintenance_preventive]
  - id: pilotage
    label: Pilotage
    area: [1.5, -15, 11, -11]   # 1,3 m de bureau + 2,5 m de bande d'allée ; reste 2,5 m jusqu'à la production
    block: bord
    front: sud
    stations: [{kind: pilotage, label: Bureau du pilotage}]
    elements:
      - {asset: prop_desk_computer, label: "Bureau : stocks, OF, commandes", role: poste}
      - {asset: prop_kpi_screen, label: Écran des indicateurs, ref: kpi, role: affichage}
    agent:
      name: Sophie
      job: Responsable de production
      character: char_manager_f
      module: pilotage
      facts: usine_pilotage
      # dit : commandes client ouvertes et en retard (urgent si en retard) ; stock PF + encours sous le minimum
      # (urgent) ; OTIF et TRS du dernier tour face aux objectifs.
      tasks: [recevoir les commandes client, créer et lancer les OF, commander la matière, suivre les indicateurs]
      notions: [point_de_commande, takt_time, loi_de_little, otif]
  - id: quai
    label: Quai partagé (réception et expédition)
    area: [-6, 8.5, 6, 15]
    block: bord
    front: nord   # allée côté hall ; la porte est sur le mur du fond (z = 15)
    stations: []
    elements:
      # posée sur le mur avant (z = 15), centrée sur la zone ; Godot ouvre le mur à son emprise
      - {asset: prop_dock_door, label: Porte de quai, ref: dock, role: porte}
      - {asset: veh_pallet_jack, label: Transpalette du quai, role: engin}
  - id: entrepot_pf
    label: Entrepôt de produits finis
    # 15,5 x 9,5 m (calibre, indicatif) : 4 racks de 5,5 x 1,5 m en 2 rangées + allée de 2,5 m, puis la zone de
    # préparation (4 x 3 m, environ 10 palettes Europe au sol, le chargement d'un camion client) ; 2,5 m d'allée
    # gardés avec l'emballage (z = 3) et la production (z = 3), règle allees_chariot.
    area: [8.5, 5.5, 24, 15]
    block: racks
    front: ouest
    # ⌈20 / 6⌉ = 4 racks ; `ref: pf` partagée : un seul stock PF (state.factory.pf.units), tous les racks le montrent
    capacity: pf_capacity_pallets
    stations: [{kind: entrepot_pf, label: Bureau de l'entrepôt}]
    elements:
      - {asset: prop_pallet_rack, label: Racks PF (20 palettes), ref: pf, role: stockage, per: places, places: 6}
      - {asset: prop_floor_zone, label: Préparation des commandes, role: tampon}
    agent:
      name: Maya
      job: Magasinière PF
      character: char_worker_f
      facts: usine_entrepot_pf
      # dit : stock PF en palettes et places libres (urgent si plein) ; commande prête ou non pour le prochain
      # camion ; commandes parties en retard ou incomplètes au dernier tour (urgent si > 0).
      tasks: [ranger les palettes venant de l'emballage, préparer les commandes, charger le camion du client, signaler le stock PF sous le minimum]
      notions: [otif]
  - id: client
    label: Client
    external: true
    block: site
    site: client
    stations: []
    elements: []   # le bâtiment est celui du site (network.sites.client.building)
    agent:
      name: Mme Durand
      job: Acheteuse du client
      character: char_manager_f
      facts: usine_client
      # dit : commande du jour (produits, jour promis) ; OTIF du dernier tour (urgent sous l'objectif) ; commandes
      # reçues en retard.
      tasks: [passer les commandes, suivre les livraisons à la date promise, se plaindre des retards]
      notions: [otif]

# Figurants : état animé (disponible, occupé, en déplacement, en pause, absent), aucun dialogue.
crew:
  - {job: operateur, per: machine, characters: [char_worker_m, char_worker_f]}
  - {job: chauffeur_fournisseur, department: fournisseur, characters: [char_driver_m]}
  - {job: chauffeur_client, department: client, characters: [char_driver_m]}

# Modules (format de ai/simulation.yaml ; l'agent du module est celui de son département, `agent.module`).
modules:
  pilotage:
    title: Pilotage
    description: Lancer les ordres de fabrication et acheter la matière pour livrer chaque commande à la date promise.
    role: {id: responsable_production, title: Responsable de production, mission: Livrer les commandes à l'heure sans rupture de matière ni stock inutile}
    stations: [pilotage]
    actions:
      - id: lancer_of
        label: Lancer des ordres de fabrication
        fields:
          - {id: line, label: Ligne, type: choice, source: lines}
          # 40 lots de 24 = 960 > environ 700 produits par ligne et par semaine : un lancement peut charger la ligne
          - {id: lots, label: Nombre de lots de 24, type: int, min: 1, max: 40, step: 1, default: 5}
      - id: commander_mp
        label: Commander la matière première
        fields:
          - {id: offer, label: Matière et fournisseur, type: choice, source: offers}
          - {id: pallets, label: Palettes (un camion), type: int, min: 1, max: 6, step: 1, default: 4}
    autopilot: ordre de fabrication (OF) quand le stock de produits finis (PF) plus l'encours passe sous une journée de demande ; matière première (MP) commandée au fournisseur standard au point de commande (consommation pendant le délai + 1 jour de révision + 2 jours de sécurité)
    notions: [point_de_commande, stock_de_securite, delai_et_fiabilite, otif, loi_de_little, takt_time, charge_et_attente]
  production:
    title: Production
    description: Protéger le goulot de chaque ligne pour que pauses et pannes en amont ne lui fassent pas perdre de temps.
    role: {id: chef_de_ligne, title: Chef·fe de ligne, mission: Faire tourner le goulot de chaque ligne le plus longtemps possible}
    stations: [tableau_ligne, machine]
    actions:
      - id: proteger_goulot
        label: Protéger le goulot d'une ligne
        fields:
          - {id: line, label: Ligne, type: choice, source: lines}
          - id: mode
            label: Protection
            type: choice
            options:
              - {id: aucune, label: "Aucune : le goulot s'arrête aux pauses et quand l'amont s'arrête"}
              - {id: releve_pauses, label: "Relève : le chef de ligne fait tourner le goulot pendant les pauses (une seule ligne à la fois)"}
              - {id: tampon_avant, label: "Tampon : table de 30 produits devant le goulot, plus d'encours"}
    autopilot: aucune protection
    notions: [goulot, tampon_avant_goulot, rendement_en_cascade, capacite_et_trs, changement_de_serie]
  maintenance:
    title: Maintenance
    description: Choisir où faire le préventif et dans quel ordre réparer, avec un seul technicien.
    role: {id: responsable_maintenance, title: Responsable maintenance, mission: Garder les goulots disponibles au juste coût}
    stations: [maintenance, machine]
    actions:
      - id: preventif
        label: Programmer le préventif d'une ligne
        fields:
          - {id: line, label: Ligne, type: choice, source: lines}
          - id: cible
            label: Machines entretenues chaque semaine
            type: choice
            options:
              - {id: aucune, label: "Aucune : pas de coût ; une machine qui s'use tombe plus souvent en panne en vieillissant"}
              - {id: goulot, label: "Le goulot : une intervention pendant une pause"}
              - {id: toutes, label: "Toutes les machines de la ligne : plus de coût et de temps de technicien"}
      - id: priorite_reparation
        label: Régler l'ordre des réparations
        fields:
          - id: ordre
            label: Ordre
            type: choice
            options:
              - {id: arrivee, label: Dans l'ordre d'arrivée des pannes}
              - {id: goulot, label: Les goulots d'abord}
    autopilot: préventif sur le goulot de chaque ligne, réparations dans l'ordre d'arrivée
    notions: [disponibilite, pannes_par_usure, maintenance_preventive, goulot]

# Agent facultatif choisi par le formateur.
extra_agents:
  direction:
    title: Direction du site
    description: Rappelle les objectifs, les semaines restantes et les écarts à combler.
    name: Claire
    job: Directrice du site
    character: char_manager_f
    department: pilotage
    facts: direction
    tasks: [fixer les objectifs, suivre les indicateurs, arbitrer les priorités]
    notions: [otif, capacite_et_trs]

personalities:
  bienveillant:
    label: Bienveillant
    traits: chaleureux, encourageant, patient
    style: vouvoie, rassure, glisse parfois un conseil
    prefix: "Petit point :"
  exigeant:
    label: Exigeant
    traits: direct, attaché aux résultats, peu patient avec les erreurs
    style: phrases sèches, va droit au chiffre
    prefix: "Il faut agir :"
  presse:
    label: Pressé
    traits: toujours entre deux tâches, efficace
    style: très bref, presque télégraphique
    prefix: "Vite :"
  methodique:
    label: Méthodique
    traits: rigoureux, aime les chiffres exacts et les procédures
    style: précis, donne les étapes dans l'ordre
    prefix: "À noter :"
  sceptique:
    label: Sceptique
    traits: prudent, se méfie des solutions miracles
    style: pointe les risques, pose une question en retour
    prefix: "Attention :"

agent_tones:
  bienveillant: {label: Bienveillants, personalities: [bienveillant, methodique]}
  mixte: {label: Caractères variés, personalities: [methodique, exigeant, bienveillant, presse, sceptique]}
  exigeant: {label: Exigeants, personalities: [exigeant, sceptique, presse]}

# Aléas annoncés une semaine à l'avance (règle de l'atelier). Effets nouveaux pour le moteur usine : `nonconform`
# (points ajoutés au taux de palettes non conformes) et `mtbf` (facteur des MTBF). Ampleurs : pilotage.effets_aleas.
events:
  retard_transport:
    title: Perturbations routières
    description: "Travaux et bouchons sur les routes des fournisseurs : 25 % de risque de retard en plus pour les livraisons de matière."
    weight: 2
    effects: {delay_risk: 0.25}
    modules: [pilotage]
  hausse_matieres:
    title: Hausse de l'acier
    description: Les prix d'achat de la matière augmentent de 10 %.
    weight: 2
    effects: {cost: 1.10}
    modules: [pilotage]
  commande_exceptionnelle:
    title: Commandes exceptionnelles du client
    description: "Le client ajoute des commandes : la demande grimpe de 15 % sur la semaine."
    weight: 1
    effects: {demand: 1.15}
    modules: [pilotage, production]
  creux_de_demande:
    title: Creux de demande
    description: "Le client commande moins cette semaine : la demande baisse de 15 %."
    weight: 1
    effects: {demand: 0.85}
    modules: [pilotage]
  lot_mp_non_conforme:
    title: Lot de matière non conforme
    description: Un lot du fournisseur est défectueux ; le taux de palettes reçues non conformes, mises en quarantaine, prend 10 points de plus.
    weight: 1
    effects: {nonconform: 0.10}
    modules: [pilotage]
  vague_de_chaleur:
    title: Vague de chaleur dans l'atelier
    description: Les fortes chaleurs fatiguent les machines ; elles tombent en panne environ 40 % plus souvent cette semaine.
    weight: 1
    effects: {mtbf: 0.7}
    modules: [maintenance, production]

events_levels:
  aucun: {label: Aucun aléa, probability: 0}
  rares: {label: Aléas rares, probability: 0.25}
  frequents: {label: Aléas fréquents, probability: 0.5}

# Notions dites par les agents et rappelées au débrief, chacune avec sa fiche du corpus (citation lue dans son
# en-tête). Textes courts, sans chiffre de partie : les chiffres viennent du moteur. `indicators` (ADR 0008) :
# indicateurs du débrief où la notion se voit (otif, trs, stockouts = jours-ligne sans MP, cash) ; carte_p et
# rotation_fifo n'en ont pas (aucun module de la tranche 1 ne les joue).
notions:
  disponibilite:
    title: Disponibilité, MTBF et MTTR
    text: "La disponibilité est le temps de marche divisé par le temps total. Pour les pannes, avec le MTBF compté en heures de marche entre deux pannes, elle vaut MTBF ÷ (MTBF + MTTR) ; l'attente du technicien et son trajet allongent l'arrêt et la font encore baisser."
    source: wikipedia-en-availability
    indicators: [trs]
  pannes_par_usure:
    title: Pannes d'usure et pannes au hasard
    text: "Réviser ou remplacer à date fixe ne se justifie que si l'équipement s'use avec l'usage : son risque de panne croît avec l'âge et l'entretien le remet à zéro. Les études des compagnies aériennes des années 1960 ont montré que la grande majorité des pannes ne sont pas forcément liées à l'âge : contre celles-là, le préventif à date fixe n'aide pas."
    # Modèle du jeu : loi de Weibull, fiche nist-sematech-weibull (forme 1 = taux de panne constant, l.68-69 ;
    # forme > 1 = taux croissant avec l'âge, déduit de l.77-78), voir machine.weibull_shape. Une seule source par notion.
    source: wikipedia-en-reliability-centered-maintenance
    indicators: [trs]
  maintenance_preventive:
    title: Maintenance préventive et corrective
    text: "Le préventif inspecte et entretient l'équipement à intervalles planifiés pour remplacer les pièces usées avant la panne ; le correctif répare après la panne, souvent plus cher à cause des arrêts et des dégâts en chaîne."
    source: wikipedia-en-maintenance
    indicators: [trs]
  goulot:
    title: Goulot et contrainte
    text: "Dans une ligne en série, le poste le plus lent fixe le débit maximal : augmenter sa capacité augmente le débit de l'ensemble, améliorer les autres ne sert à rien. Tant que la demande reste sous ce débit, c'est le marché qui limite l'usine ; lors d'un pic ou après une panne, ce poste devient la contrainte et chaque heure qu'il perd est perdue pour la ligne."
    source: wikipedia-fr-theorie-des-contraintes
    indicators: [otif, trs]
  tampon_avant_goulot:
    title: Protéger la contrainte par des tampons
    text: "Un stock tampon placé devant la contrainte lui évite de manquer de travail quand un poste amont s'arrête, et de la place libre derrière elle évite qu'un arrêt en aval la bloque. Le tampon achète du temps ; il doit suffire sans être excessif."
    source: wikipedia-en-theory-of-constraints
    indicators: [otif, trs]
  rendement_en_cascade:
    title: Rendement cumulé
    text: "La probabilité qu'un produit sorte bon d'un procédé à plusieurs étapes est le produit des rendements de chaque étape : le rendement de la ligne n'est donc jamais meilleur que celui de sa moins bonne machine."
    source: wikipedia-en-rolled-throughput-yield
    indicators: [trs]
  capacite_et_trs:
    title: Taux de rendement synthétique (TRS)
    text: "Le TRS (OEE en anglais) multiplie trois taux : disponibilité (temps de marche ÷ temps d'ouverture), performance (vitesse réelle ÷ vitesse maximale) et qualité (bons ÷ produits). Le temps d'ouverture est une convention : ici, les pauses le réduisent ; d'autres organisations comptent la pause comme un arrêt. À 100 %, la machine tourne sans arrêt, à pleine vitesse, sans défaut."
    # fiche fr l.18 et l.40 (TRS = Tb x Tf x Tq), l.48 (pause : arrêt ou réduction du temps d'ouverture selon les organisations)
    source: wikipedia-fr-taux-de-rendement-synthetique
    indicators: [trs]
  loi_de_little:
    title: Loi de Little
    text: "En régime stable, l'encours moyen égale le débit multiplié par le temps moyen passé dans le système : à débit égal, plus d'encours veut dire des produits qui attendent plus longtemps."
    source: wikipedia-en-little-s-law
    indicators: [otif]
  charge_et_attente:
    title: Charge et attente
    text: "Selon l'approximation de Kingman, l'attente devant un poste croît avec u ÷ (1 − u), u étant son taux d'occupation, et avec la variabilité des arrivées et des temps de service : près de 100 % de charge, elle explose."
    source: wikipedia-en-kingman-s-formula
    indicators: [otif]
  takt_time:
    title: Takt time
    text: "Le takt time est le temps disponible divisé par le nombre d'unités demandées : le rythme à tenir pour suivre le client. Il ne se confond pas avec le temps de cycle réel, qui compte aussi les pièces défectueuses et les réglages."
    source: wikipedia-fr-takt-time
    indicators: [otif]
  changement_de_serie:
    title: Changement de série (SMED)
    text: "Le SMED réduit le temps de changement de série pour pouvoir produire en petits lots ; « single minute » veut dire moins de 10 minutes."
    source: wikipedia-en-single-minute-exchange-of-die
    indicators: [trs]
  carte_p:
    title: Carte p
    text: "La carte p suit la part de produits non conformes d'un échantillon ; sa limite haute vaut p + 3 × racine(p (1 − p) ÷ n). Un lot au-delà signale probablement un changement du procédé plutôt qu'un simple aléa."
    source: wikipedia-en-p-chart
  rotation_fifo:
    title: Premier entré, premier sorti (FIFO)
    text: "Sortir d'abord ce qui est arrivé en premier évite que le stock vieillisse ou se dégrade avant d'être utilisé."
    source: wikipedia-en-stock-rotation
  point_de_commande:
    title: Point de commande
    text: "On recommande quand le stock, commandes en cours comprises, passe sous le point de commande, égal à la consommation prévue pendant le délai d'approvisionnement plus le stock de sécurité."
    source: wikipedia-en-reorder-point
    indicators: [stockouts, otif]
  stock_de_securite:
    title: Stock de sécurité
    text: "Le stock de sécurité couvre l'incertitude de la demande et des délais ; plus ils sont imprévisibles et plus le service visé est élevé, plus il doit être important."
    source: wikipedia-fr-stock-de-securite
    indicators: [stockouts, otif]
  delai_et_fiabilite:
    title: Délai et fiabilité des fournisseurs
    text: "Plus les délais de réapprovisionnement sont aléatoires, plus le stock de sécurité doit être important ; un fournisseur aux délais irréguliers oblige donc à garder davantage de matière en réserve."
    source: wikipedia-fr-stock-de-securite
    indicators: [stockouts, otif]
  otif:
    title: OTIF (à l'heure et complet)
    text: "Le modèle SCOR mesure la performance de livraison comme la part des produits livrés à temps et en totalité à la date promise."
    source: wikipedia-en-supply-chain-operations-reference
    indicators: [otif]

# Panneaux (annexe §5). Clé à exposer par le moteur, hors annexe §2 : kpis.good_share (part de bons, 0-100).
# `better: lower` où moins est mieux ; `warn` : seuil « attention » de la pastille (values.interface.seuils_attention).
panels:
  - id: bandeau
    type: kpis
    title: Indicateurs
    placement: bandeau
    source: kpis
    columns:
      - {key: otif, label: OTIF, format: pct, target: targets.otif, warn: 90}
      - {key: trs, label: TRS, format: pct, target: targets.trs, warn: 73}
      - {key: stockouts, label: Jours-ligne sans MP, format: int, target: targets.stockouts, better: lower}
      - {key: cash, label: Trésorerie, format: money, target: targets.cash_final}
  - id: bandeau_pf
    type: kpis
    title: Stock PF
    placement: bandeau
    source: factory.stocks.pf
    columns:
      - {key: pallets, label: Stock PF (palettes), format: int}
      - {key: capacity_pallets, label: Places, format: int}
  - id: flux
    type: flow
    title: Flux de l'usine
    placement: tableau_de_bord
    source: factory.flow
  - id: lignes
    type: table
    title: Lignes
    placement: tableau_de_bord
    source: factory.lines
    columns:
      - {key: name, label: Ligne}
      - {key: bottleneck_id, label: Goulot}
      - {key: theoretical_h, label: Débit théorique (/ h), format: dec1}
      - {key: expected_h, label: Bons attendus (/ h), format: dec1}
      - {key: real_h, label: Bons mesurés (/ h), format: dec1}
      - {key: production_rate, label: Réalisation du plan, format: pct}
      - {key: wip, label: Encours, format: int}
  - id: machines
    type: table
    title: Machines
    placement: tableau_de_bord
    source: factory.machines
    columns: &machine_columns
      - {key: name, label: Machine}
      - key: state
        label: État
        format: state
        labels: {arret: Arrêt, marche: En marche, pause: Pause, reglage: Réglage, panne: En panne, attente_matiere: Attente matière, sortie_pleine: Sortie pleine}
      - {key: availability, label: Disponibilité, format: pct}
      - {key: produced, label: Produits, format: int}
      - {key: failures, label: Pannes, format: int, better: lower}
      - {key: downtime_min, label: Arrêt, format: minutes, better: lower}
      - {key: buffer, label: Table d'attente, format: int}
  - id: historique
    type: chart
    title: OTIF et TRS par semaine
    placement: tableau_de_bord
    source: history
    columns:
      - {key: otif, label: OTIF, format: pct, target: targets.otif}
      - {key: trs, label: TRS, format: pct, target: targets.trs}
  - id: ordres
    type: table
    title: Ordres de fabrication
    placement: tableau_de_bord
    source: factory.orders.production
    columns:
      - {key: id, label: OF}
      - {key: line_id, label: Ligne}
      - {key: quantity, label: Lancés, format: int}
      - {key: done, label: Faits, format: int}
      - {key: status, label: État, format: state, labels: {attente: En attente, en_cours: En cours, termine: Terminé}}
  - id: poste_machine
    type: table
    title: Cette machine
    placement: poste
    station_kinds: [machine]
    source: factory.machines
    match: id
    columns: *machine_columns
  - id: commandes_client
    type: table
    title: Commandes client
    placement: poste
    station_kinds: [pilotage]
    source: factory.orders.customer
    columns:
      - {key: id, label: Commande}
      - {key: quantity, label: Produits, format: int}
      - {key: due_day, label: Jour promis, format: int}
      - {key: shipped, label: Expédiés, format: int}
      - {key: status, label: État, format: state, labels: {ouverte: Ouverte, livree: Livrée, en_retard: En retard}}
  - id: stock_matiere
    type: table
    title: Matière première
    placement: poste
    station_kinds: [pilotage]
    source: factory.stocks.mp
    columns:
      - {key: name, label: Matière}
      - {key: pallets, label: Palettes, format: int}
      - {key: capacity_pallets, label: Places, format: int}
      - {key: reorder_point, label: Point de commande, format: int}
      - {key: pending, label: En commande, format: int}
  - id: pannes
    type: table
    title: Pannes et disponibilité
    placement: poste
    station_kinds: [maintenance]
    source: factory.machines
    columns:
      - {key: name, label: Machine}
      - {key: failures, label: Pannes, format: int, better: lower}
      - {key: downtime_min, label: Arrêt, format: minutes, better: lower}
      - {key: availability, label: Disponibilité, format: pct}
      - {key: age_h, label: Âge (h de marche), format: dec1}
  - id: part_de_bons
    type: gauge
    title: Part de produits bons
    placement: poste
    station_kinds: [poste_qualite]
    source: kpis
    columns:
      - {key: good_share, label: Part de bons, format: pct}
    min: 80
    max: 100
  # Supervision du formateur (ADR 0009) : mêmes données que le joueur, aucune nouvelle source ni nouveau calcul.
  - id: sup_indicateurs
    type: kpis
    title: Indicateurs de la partie
    placement: supervision
    audience: formateur
    source: kpis
    columns:
      - {key: otif, label: OTIF, format: pct, target: targets.otif, warn: 90}
      - {key: trs, label: TRS, format: pct, target: targets.trs, warn: 73}
      - {key: stockouts, label: Jours-ligne sans MP, format: int, target: targets.stockouts, better: lower}
      - {key: good_share, label: Part de bons, format: pct}
      - {key: cash, label: Trésorerie, format: money, target: targets.cash_final}
  - id: sup_lignes
    type: table
    title: Lignes et goulots
    placement: supervision
    audience: formateur
    source: factory.lines
    columns:
      - {key: name, label: Ligne}
      - {key: bottleneck_id, label: Goulot}
      - {key: expected_h, label: Bons attendus (/ h), format: dec1}
      - {key: real_h, label: Bons mesurés (/ h), format: dec1}
      - {key: production_rate, label: Réalisation du plan, format: pct}
      - {key: wip, label: Encours, format: int}
  - id: sup_machines
    type: table
    title: Machines
    placement: supervision
    audience: formateur
