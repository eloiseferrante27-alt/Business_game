# Aléas annoncés une semaine à l'avance (règle de l'atelier). Effets nouveaux pour le moteur usine : `nonconform`
# (points ajoutés au taux de palettes non conformes) et `mtbf` (facteur des MTBF). Ampleurs : pilotage.effets_aleas.
events:
  retard_transport:
    title: Perturbations routières
    description: "Travaux et bouchons sur les routes des fournisseurs : 25 % de risque de retard en plus pour les livraisons de matière."
    weight: 2
    effects: {delay_risk: 0.25}
    modules: [pilotage]
  hausse_matieres:
    title: Hausse de l'acier
    description: Les prix d'achat de la matière augmentent de 10 %.
    weight: 2
    effects: {cost: 1.10}
    modules: [pilotage]
  commande_exceptionnelle:
    title: Commandes exceptionnelles du client
    description: "Le client ajoute des commandes : la demande grimpe de 15 % sur la semaine."
    weight: 1
    effects: {demand: 1.15}
    modules: [pilotage, production]
  creux_de_demande:
    title: Creux de demande
    description: "Le client commande moins cette semaine : la demande baisse de 15 %."
    weight: 1
    effects: {demand: 0.85}
    modules: [pilotage]
  lot_mp_non_conforme:
    title: Lot de matière non conforme
    description: Un lot du fournisseur est défectueux ; le taux de palettes reçues non conformes, mises en quarantaine, prend 10 points de plus.
    weight: 1
    effects: {nonconform: 0.10}
    modules: [pilotage]
  vague_de_chaleur:
    title: Vague de chaleur dans l'atelier
    description: Les fortes chaleurs fatiguent les machines ; elles tombent en panne environ 40 % plus souvent cette semaine.
    weight: 1
    effects: {mtbf: 0.7}
    modules: [maintenance, production]

events_levels:
  aucun: {label: Aucun aléa, probability: 0}
  rares: {label: Aléas rares, probability: 0.25}
  frequents: {label: Aléas fréquents, probability: 0.5}

# Notions dites par les agents et rappelées au débrief, chacune avec sa fiche du corpus (citation lue dans son
# en-tête). Textes courts, sans chiffre de partie : les chiffres viennent du moteur. `indicators` (ADR 0008) :
# indicateurs du débrief où la notion se voit (otif, trs, stockouts = jours-ligne sans MP, cash) ; carte_p et
# rotation_fifo n'en ont pas (aucun module de la tranche 1 ne les joue).
notions:
  disponibilite:
    title: Disponibilité, MTBF et MTTR
    text: "La disponibilité est le temps de marche divisé par le temps total. Pour les pannes, avec le MTBF compté en heures de marche entre deux pannes, elle vaut MTBF ÷ (MTBF + MTTR) ; l'attente du technicien et son trajet allongent l'arrêt et la font encore baisser."
    source: wikipedia-en-availability
    indicators: [trs]
  pannes_par_usure:
    title: Pannes d'usure et pannes au hasard
    text: "Réviser ou remplacer à date fixe ne se justifie que si l'équipement s'use avec l'usage : son risque de panne croît avec l'âge et l'entretien le remet à zéro. Les études des compagnies aériennes des années 1960 ont montré que la plupart des pannes ne sont pas liées à l'âge : contre celles-là, le préventif à date fixe n'aide pas."
    source: wikipedia-en-reliability-centered-maintenance
    indicators: [trs]
  maintenance_preventive:
    title: Maintenance préventive et corrective
    text: "Le préventif inspecte et entretient l'équipement à intervalles planifiés pour remplacer les pièces usées avant la panne ; le correctif répare après la panne, souvent plus cher à cause des arrêts et des dégâts en chaîne."
    source: wikipedia-en-maintenance
    indicators: [trs]
  goulot:
    title: Goulot et contrainte
    text: "Dans une ligne en série, le poste le plus lent fixe le débit maximal : augmenter sa capacité augmente le débit de l'ensemble, améliorer les autres ne sert à rien. Tant que la demande reste sous ce débit, c'est le marché qui limite l'usine ; lors d'un pic ou après une panne, ce poste devient la contrainte et chaque heure qu'il perd est perdue pour la ligne."
    source: wikipedia-fr-theorie-des-contraintes
    indicators: [otif, trs]
  tampon_avant_goulot:
    title: Protéger la contrainte par des tampons
    text: "Un stock tampon placé devant la contrainte lui évite de manquer de travail quand un poste amont s'arrête, et de la place libre derrière elle évite qu'un arrêt en aval la bloque. Le tampon achète du temps ; il doit suffire sans être excessif."
    source: wikipedia-en-theory-of-constraints
    indicators: [otif, trs]
  rendement_en_cascade:
    title: Rendement cumulé
    text: "La probabilité qu'un produit sorte bon d'un procédé à plusieurs étapes est le produit des rendements de chaque étape : le rendement de la ligne n'est donc jamais meilleur que celui de sa moins bonne machine."
    source: wikipedia-en-rolled-throughput-yield
    indicators: [trs]
  capacite_et_trs:
    title: Taux de rendement synthétique (TRS)
    text: "Le TRS (OEE en anglais) multiplie trois taux : disponibilité (temps de marche ÷ temps planifié, pauses et pannes comprises), performance (vitesse réelle ÷ vitesse maximale) et qualité (bons ÷ produits). À 100 %, la machine tourne sans arrêt, à pleine vitesse, sans défaut."
    source: wikipedia-en-overall-equipment-effectiveness
    indicators: [trs]
  loi_de_little:
    title: Loi de Little
    text: "En régime stable, l'encours moyen égale le débit multiplié par le temps moyen passé dans le système : à débit égal, plus d'encours veut dire des produits qui attendent plus longtemps."
    source: wikipedia-en-little-s-law
    indicators: [otif]
  charge_et_attente:
    title: Charge et attente
    text: "Selon l'approximation de Kingman, l'attente devant un poste croît avec u ÷ (1 − u), u étant son taux d'occupation, et avec la variabilité des arrivées et des temps de service : près de 100 % de charge, elle explose."
    source: wikipedia-en-kingman-s-formula
    indicators: [otif]
  takt_time:
    title: Takt time
    text: "Le takt time est le temps disponible divisé par le nombre d'unités demandées : le rythme à tenir pour suivre le client. Il ne se confond pas avec le temps de cycle réel, qui compte aussi les pièces défectueuses et les réglages."
    source: wikipedia-fr-takt-time
    indicators: [otif]
  changement_de_serie:
    title: Changement de série (SMED)
    text: "Le SMED réduit le temps de changement de série pour pouvoir produire en petits lots ; « single minute » veut dire moins de 10 minutes."
    source: wikipedia-en-single-minute-exchange-of-die
    indicators: [trs]
  carte_p:
    title: Carte p
    text: "La carte p suit la part de produits non conformes d'un échantillon ; sa limite haute vaut p + 3 × racine(p (1 − p) ÷ n). Un lot au-delà signale probablement un changement du procédé plutôt qu'un simple aléa."
    source: wikipedia-en-p-chart
  rotation_fifo:
    title: Premier entré, premier sorti (FIFO)
    text: "Sortir d'abord ce qui est arrivé en premier évite que le stock vieillisse ou se dégrade avant d'être utilisé."
    source: wikipedia-en-stock-rotation
  point_de_commande:
    title: Point de commande
    text: "On recommande quand le stock, commandes en cours comprises, passe sous le point de commande, égal à la consommation prévue pendant le délai d'approvisionnement plus le stock de sécurité."
    source: wikipedia-en-reorder-point
    indicators: [stockouts, otif]
  stock_de_securite:
    title: Stock de sécurité
    text: "Le stock de sécurité couvre l'incertitude de la demande et des délais ; plus ils sont imprévisibles et plus le service visé est élevé, plus il doit être important."
    source: wikipedia-fr-stock-de-securite
    indicators: [stockouts, otif]
  delai_et_fiabilite:
    title: Délai et fiabilité des fournisseurs
    text: "Des délais de réapprovisionnement longs ou aléatoires obligent à commander plus tôt et à garder davantage de stock de sécurité ; le prix n'est qu'un critère de choix parmi d'autres."
    source: wikipedia-fr-stock-de-securite
    indicators: [stockouts, otif]
  otif:
    title: OTIF (à l'heure et complet)
    text: "Le modèle SCOR mesure la performance de livraison comme la part des produits livrés à temps et en totalité à la date promise."
    source: wikipedia-en-supply-chain-operations-reference
    indicators: [otif]

# Panneaux (annexe §5). Clé à exposer par le moteur, hors annexe §2 : kpis.good_share (part de bons, 0-100).
# `better: lower` où moins est mieux ; `warn` : seuil « attention » de la pastille (values.interface.seuils_attention).
panels:
  - id: bandeau
    type: kpis
    title: Indicateurs
    placement: bandeau
    source: kpis
    columns:
      - {key: otif, label: OTIF, format: pct, target: targets.otif, warn: 90}
      - {key: trs, label: TRS, format: pct, target: targets.trs, warn: 73}
      - {key: stockouts, label: Jours-ligne sans MP, format: int, target: targets.stockouts, better: lower}
      - {key: cash, label: Trésorerie, format: money, target: targets.cash_final}
  - id: bandeau_pf
    type: kpis
    title: Stock PF
    placement: bandeau
    source: factory.stocks.pf
    columns:
      - {key: pallets, label: Stock PF (palettes), format: int}
      - {key: capacity_pallets, label: Places, format: int}
  - id: flux
    type: flow
    title: Flux de l'usine
    placement: tableau_de_bord
    source: factory.flow
  - id: lignes
    type: table
    title: Lignes
    placement: tableau_de_bord
    source: factory.lines
    columns:
      - {key: name, label: Ligne}
      - {key: bottleneck_id, label: Goulot}
      - {key: theoretical_h, label: Débit théorique (/ h), format: dec1}
      - {key: expected_h, label: Bons attendus (/ h), format: dec1}
      - {key: real_h, label: Bons mesurés (/ h), format: dec1}
      - {key: production_rate, label: Réalisation du plan, format: pct}
      - {key: wip, label: Encours, format: int}
  - id: machines
    type: table
    title: Machines
    placement: tableau_de_bord
    source: factory.machines
    columns: &machine_columns
      - {key: name, label: Machine}
      - key: state
        label: État
        format: state
        labels: {arret: Arrêt, marche: En marche, pause: Pause, reglage: Réglage, panne: En panne, attente_matiere: Attente matière, sortie_pleine: Sortie pleine}
      - {key: availability, label: Disponibilité, format: pct}
      - {key: produced, label: Produits, format: int}
      - {key: failures, label: Pannes, format: int, better: lower}
      - {key: downtime_min, label: Arrêt, format: minutes, better: lower}
      - {key: buffer, label: Table d'attente, format: int}
  - id: historique
    type: chart
    title: OTIF et TRS par semaine
    placement: tableau_de_bord
    source: history
    columns:
      - {key: otif, label: OTIF, format: pct, target: targets.otif}
      - {key: trs, label: TRS, format: pct, target: targets.trs}
  - id: ordres
    type: table
    title: Ordres de fabrication
    placement: tableau_de_bord
    source: factory.orders.production
    columns:
      - {key: id, label: OF}
      - {key: line_id, label: Ligne}
      - {key: quantity, label: Lancés, format: int}
      - {key: done, label: Faits, format: int}
      - {key: status, label: État, format: state, labels: {attente: En attente, en_cours: En cours, termine: Terminé}}
  - id: poste_machine
    type: table
    title: Cette machine
    placement: poste
    station_kinds: [machine]
    source: factory.machines
    match: id
    columns: *machine_columns
  - id: commandes_client
    type: table
    title: Commandes client
    placement: poste
    station_kinds: [pilotage]
    source: factory.orders.customer
    columns:
      - {key: id, label: Commande}
      - {key: quantity, label: Produits, format: int}
      - {key: due_day, label: Jour promis, format: int}
      - {key: shipped, label: Expédiés, format: int}
      - {key: status, label: État, format: state, labels: {ouverte: Ouverte, livree: Livrée, en_retard: En retard}}
  - id: stock_matiere
    type: table
    title: Matière première
    placement: poste
    station_kinds: [pilotage]
    source: factory.stocks.mp
    columns:
      - {key: name, label: Matière}
      - {key: pallets, label: Palettes, format: int}
      - {key: capacity_pallets, label: Places, format: int}
      - {key: reorder_point, label: Point de commande, format: int}
      - {key: pending, label: En commande, format: int}
  - id: pannes
    type: table
    title: Pannes et disponibilité
    placement: poste
    station_kinds: [maintenance]
    source: factory.machines
    columns:
      - {key: name, label: Machine}
      - {key: failures, label: Pannes, format: int, better: lower}
      - {key: downtime_min, label: Arrêt, format: minutes, better: lower}
      - {key: availability, label: Disponibilité, format: pct}
      - {key: age_h, label: Âge (h de marche), format: dec1}
  - id: part_de_bons
    type: gauge
    title: Part de produits bons
    placement: poste
    station_kinds: [poste_qualite]
    source: kpis
    columns:
      - {key: good_share, label: Part de bons, format: pct}
    min: 80
    max: 100
  # Supervision du formateur (ADR 0009) : mêmes données que le joueur, aucune nouvelle source ni nouveau calcul.
  - id: sup_indicateurs
    type: kpis
    title: Indicateurs de la partie
    placement: supervision
    audience: formateur
    source: kpis
    columns:
      - {key: otif, label: OTIF, format: pct, target: targets.otif, warn: 90}
      - {key: trs, label: TRS, format: pct, target: targets.trs, warn: 73}
      - {key: stockouts, label: Jours-ligne sans MP, format: int, target: targets.stockouts, better: lower}
      - {key: good_share, label: Part de bons, format: pct}
      - {key: cash, label: Trésorerie, format: money, target: targets.cash_final}
  - id: sup_lignes
    type: table
    title: Lignes et goulots
    placement: supervision
    audience: formateur
    source: factory.lines
    columns:
      - {key: name, label: Ligne}
      - {key: bottleneck_id, label: Goulot}
      - {key: expected_h, label: Bons attendus (/ h), format: dec1}
      - {key: real_h, label: Bons mesurés (/ h), format: dec1}
      - {key: production_rate, label: Réalisation du plan, format: pct}
      - {key: wip, label: Encours, format: int}
  - id: sup_machines
    type: table
    title: Machines
    placement: supervision
    audience: formateur
    source: factory.machines
    columns: *machine_columns
  - id: sup_historique
    type: chart
    title: OTIF et TRS par semaine
    placement: supervision
    audience: formateur
    source: history
    columns:
      - {key: otif, label: OTIF, format: pct, target: targets.otif}
      - {key: trs, label: TRS, format: pct, target: targets.trs}
  - id: sup_commandes
    type: table
    title: Commandes client
    placement: supervision
    audience: formateur
    source: factory.orders.customer
    columns:
      - {key: id, label: Commande}
      - {key: quantity, label: Produits, format: int}
      - {key: due_day, label: Jour promis, format: int}
      - {key: shipped, label: Expédiés, format: int}
      - {key: status, label: État, format: state, labels: {ouverte: Ouverte, livree: Livrée, en_retard: En retard}}

# Barre d'actions (ADR 0008, annexe §1 `Tool`, §2) : une entrée par action de module au plus, touche = rang + 1.
# Tableau de bord et aide d'abord (mêmes touches dans toutes les parties) ; l'ordre des réparations, réglage rare,
# et la caméra en dernier. L'ordre de la liste EST la priorité : au-delà de 6 outils de barre par public (arbitrage
# a), `generate` masque en partant de la fin ceux qui ont un menu (3 modules : réparations puis préventif, restés
# au clic sur le poste maintenance ou machine) ; la caméra, sans menu, n'est jamais masquée. Ordre validé. `menu` (ADR 0009, point 9) : cibles du clic (station:<kind>, agent:*, site:<kind>),
# 6 entrées au plus par cible et par public ; `bar: false` = menu seulement. Libellés : interface, aucune affirmation
# métier. Outils du formateur : routes Staff existantes (démarrer, semaine suivante, rejeu, mémoire, débrief).
tools:
  - {id: tableau, label: Tableau de bord, kind: tableau_de_bord}
  - {id: aide, label: Aide, kind: aide}
  - {id: lancement, label: Lancer des OF, kind: action, action_id: lancer_of, menu: ["station:pilotage"]}
  - {id: commande, label: Commande MP, kind: action, action_id: commander_mp, menu: ["station:pilotage", "site:fournisseur"]}
  - {id: protection, label: Protéger goulot, kind: action, action_id: proteger_goulot, menu: ["station:tableau_ligne", "station:machine"]}
  - {id: preventif, label: Préventif, kind: action, action_id: preventif, menu: ["station:maintenance", "station:machine"]}
  - {id: reparations, label: Réparations, kind: action, action_id: priorite_reparation, menu: ["station:maintenance", "station:machine"]}
  - {id: camera, label: Caméra, kind: camera}
  - {id: parler, label: Parler, kind: parler, bar: false, menu: ["agent:*"]}
  - id: fiche
    label: Fiche
    kind: fiche
    bar: false
    menu: ["station:poste_reception", "station:magasin_mp", "station:tableau_ligne", "station:machine", "station:poste_qualite",
           "station:poste_emballage", "station:maintenance", "station:pilotage", "station:entrepot_pf", "agent:*",
           "site:fournisseur", "site:client"]
  - {id: demarrer, label: Démarrer, kind: demarrer, audience: formateur}
  - {id: avancer, label: Semaine suivante, kind: avancer, audience: formateur}
  - {id: rejeu, label: Rejeu, kind: rejeu, audience: formateur}
  - {id: memoire, label: Mémoire agents, kind: memoire, audience: formateur, menu: ["agent:*"]}
  - {id: debrief, label: Débrief, kind: debrief, audience: formateur}

# Didacticiel par défaut (jeu par paramètres, repli de la section journey). Sans chiffre. Ancres du pack :
# panneau bandeau, postes machine, département production, outils. Provenance : colonnes des panneaux bandeau,
# poste_machine et lignes ; goulot = notion goulot (wikipedia-fr-theorie-des-contraintes).
tutorial:
  - {id: indicateurs, title: Vos indicateurs, anchor: "panel:bandeau",
     text: "Le bandeau montre l'OTIF, le TRS, les jours-ligne sans matière et la trésorerie face à leur cible."}
  - {id: machines, title: Chaque machine, anchor: "station:machine",
     text: "Approchez une machine : son panneau donne son état, sa disponibilité, ses pannes et sa table d'attente."}
  - {id: goulot, title: Le goulot de chaque ligne, anchor: "dept:production",
     text: "La machine la plus lente d'une ligne fixe son débit maximal : quand la demande l'atteint, chaque minute qu'elle perd est perdue pour la ligne."}
  - {id: tableau, title: Le tableau de bord, anchor: "tool:tableau",
     text: "Il montre le flux, les lignes et les machines : comparez le débit de bons attendu et le débit mesuré de chaque ligne."}
  - {id: decisions, title: Vos décisions, anchor: "tool:aide",
     text: "Approchez le poste de votre module ou utilisez la barre d'actions pour décider ; l'aide rouvre ce guide."}
