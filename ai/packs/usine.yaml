# Pack de domaine « usine » (ADR 0007 et son annexe, section 5), version v0 du 2026-10-29.
# Usine à N lignes identiques (1 à 3) de 4 machines en série, jouée par tours d'une semaine (5 jours de 8 h)
# simulés minute par minute par gmix.game.factory puis rejoués en 3D. Propriétaire : game-designer.
# Inspiration : cahier « Mon monde – usine 3D » de l'utilisateur (docs/references/usine-3d/, 22/10/2026) ; le
# cahier le dit lui-même : « Toutes les valeurs données sont des exemples ». Noms de personnes, d'entreprises,
# de fournisseurs et de clients : fictifs.
#
# Provenance (section `values`) : `source` = fiche du corpus knowledge/supply-chain (citation lue dans son
# en-tête « > Source : ») ; `calibre` = choisi pour la jouabilité ou la justesse, la note dit pourquoi ;
# `exemple` = valeur du cahier, non sourcée. `value` absent : les nombres sont dans `machine_types` ou
# `difficulties`. Les formules sont du code testé (gmix.game.factory), jamais évaluées depuis ce fichier.
#
# Valeurs restées `exemple` (cahier) : temps de cycle, MTBF, MTTR, réglages, taux de défaut, tables d'attente
# (10), opérateurs (1 par machine) des 4 machines ; fournisseur standard (délai 3 j, 95 % à l'heure, 2 % de
# non-conformes, 1 palette minimum, camion de 6 palettes, livraison 8 h - 10 h, stock illimité) ; réception
# (2 min de déchargement et 5 min de contrôle par palette, dépose 6 palettes, quarantaine 2) ; racks MP (24) ;
# emballage (6 colis par palette, 2 min par colis, 5 min de filmage) ; entrepôt PF (20 palettes, 2 min de
# chargement) ; variabilité de la demande (± 10 %) ; 1 technicien (3 min de trajet), 1 chef de ligne, 1 quai
# partagé ; journée de 8 h ; contrôle à 100 % ; sortie FIFO.
#
# Corrections du cahier (audit du 28/10/2026, annexe §5), toutes en `calibre` :
#  - pauses : 2 x 10 + 1 x 20 min dans `clock.breaks` (même total que les 4 x 10 du cahier), `stop_min` = 0 ;
#  - postes hors lignes >= 1,2 x le débit théorique de 3 lignes (60 / h, donc 72 / h) : contrôle 0,7 min par
#    produit (85,7 / h, cahier : 1 min, 60 / h) ; 4 produits par colis (emballage 84,7 / h, cahier : 21 / h) ;
#  - lot de 24 unités lancées (une palette de 24) au lieu de 20 ; besoin lancé = besoin / rendement cumulé
#    (le « x (1 + taux) » du cahier sous-estime le surplus) ;
#  - 3 transferts pour 4 machines (M4 envoie au contrôle) : traversée 9 min, lot de 20 en 66 min ;
#  - disponibilité avec pannes (le cahier ne compte que les pauses), rendement cumulé des 4 machines (le cahier ne
#    prend que le goulot), TRS décomposé et distinct du taux de réalisation du plan ;
#  - demande = charge (0,80 à 0,92) x débit réel attendu des machines de la partie (cahier : 100 / jour, 23 % de sa
#    propre capacité) ; délai promis J+2 (J+1 en expert) au lieu de 5 jours (une semaine entière) ;
#  - seuil de blocage d'un lot par la carte p (tranche 2) au lieu de 15 % fixe ;
#  - trois fournisseurs en profils (rapide, standard, économique) autour du fournisseur du cahier.
#
# Choix pédagogiques (objectifs observables, niveau de Bloom -> indicateur ou action -> leçon du débrief) :
#  1. Identifier le goulot de chaque ligne (analyser) -> `factory.lines[].bottleneck_id`, attente et saturation
#     des machines -> notion `goulot` : améliorer une autre machine ne rapporte rien.
#  2. Protéger le goulot (appliquer) -> action `proteger_goulot` (relève pendant les pauses, tampon avant) et
#     `priorite_reparation` -> débit réel attendu / mesuré (`formulas.goulot`).
#  3. Calculer disponibilité, rendement cumulé et TRS attendus puis les comparer aux mesures (appliquer,
#     évaluer) -> `factory.formulas[]` (attendu / mesuré) -> notions `disponibilite`, `rendement_en_cascade`,
#     `capacite_et_trs`.
#  4. Choisir où faire du préventif (évaluer) -> action `preventif` -> pannes et arrêts par machine ; leçon : le
#     préventif évite les pannes d'usure, il ne sert à rien contre les pannes au hasard (`pannes_par_usure`).
#  5. Dimensionner lancements et achats (appliquer) -> `lancer_of`, `commander_mp` -> OTIF, ruptures MP, stock PF,
#     encours (`loi_de_little`, `point_de_commande`, `stock_de_securite`, `delai_et_fiabilite`).
#  6. Expliquer pourquoi une usine chargée près de 100 % livre en retard (comprendre) -> charge de la difficulté,
#     attente des commandes -> notion `charge_et_attente`.
#
# Hors corpus, donc non présenté comme notion : temps d'un lot = premier produit + (n - 1) x cycle du goulot
# (formule du cahier, affichée comme `exemple` au débrief) ; loi de Weibull (fiche nist-sematech-weibull depuis le
# 21/11, citée par machine.weibull_shape ; valeurs de forme en `calibre`) ;
# « six grandes pertes » du TRS (texte absent de la fiche) ; NF E60-182, NF EN 13306, NF ISO 2859-1 (non lues).
# Tranche 2 et suivantes (non déclarées ici pour que chaque action ait son handler) : module qualité
# (`frequence_controle`), retouches, absences, usure d'outil, chariot à batterie, aléas propres à l'usine ;
# assets prop_bin_shelf, prop_part_token (tranche 2), prop_safety_cabinet (tranche 3).

version: 1
id: usine
domain: supply-chain
engine: factory
label: Usine à lignes de production
description: >-
  Une usine fabrique un produit sur 1 à 3 lignes de machines en série : réception, stock de matière, lignes,
  contrôle, emballage, entrepôt et quai partagé. Les joueurs lancent les ordres de fabrication, achètent la
  matière, protègent le goulot et organisent la maintenance ; chaque semaine est simulée puis rejouée en 3D.
inspiration: Cahier « Mon monde – usine 3D » (docs/references/usine-3d/, 22/10/2026), valeurs d'exemple corrigées par l'audit du 28/10/2026.

# Plan en U (annexe §5) : hall de 48 x 30 m, x de -24 à 24, z de -15 à 15. Allées d'au moins 2,5 m entre zones.
world:
  template: usine
  size: [48, 30]
  spawn: [0, 20]

# --- Monde sur grilles et réseau logistique (ADR 0009) -------------------------------------------------------------
# Vocabulaire générique (blocs, sites, liens, règles), valeurs propres à l'usine. Le placeur (gmix.game.layout) pose
# les objets sur ces grilles sans hasard ; l'IA ne choisit que dans ces listes.
grid:
  site_cell_m: 0.5          # les `area` internes sont des multiples de 0,5 m

# Bandes d'allée en cellules de 0,5 m : 5 cellules = 2,5 m (règle allees_chariot). `decor` = palette de l'éditeur
# du formateur (assets `importe`, rôles decor ou affichage, hors couverture). Aucun décor ne figure un stock (palettes,
# cartons pleins) que le moteur ne simule pas.
block_types:
  bord:
    label: Zone de travail le long d'une allée
    pattern: edge
    cell_m: 0.5
    front_aisle_cells: 5
    row_aisle_cells: 0
    decor: [furn_plant, furn_bookcase, furn_chair, furn_office_chair, furn_table, prop_box_small, prop_wall_board]
  racks:
    label: Stockage en rangées de racks
    pattern: rows
    cell_m: 0.5
    front_aisle_cells: 5
    row_aisle_cells: 5        # allée de cariste entre deux rangées
    decor: [prop_traffic_cone, furn_bookcase, prop_wall_board]
  ligne:
    label: Lignes de machines en série
    pattern: line
    cell_m: 0.5
    front_aisle_cells: 0      # les allées de 3 m entre zones bordent déjà le bloc
    row_aisle_cells: 5        # 3 lignes x 2,1 m + 2 x 2,5 m = 11,3 m dans les 11,5 m de la zone
    decor: [prop_traffic_cone, prop_wall_board, furn_bookcase]
  site:
    label: Site extérieur (bâtiment et abords)
    pattern: single
    cell_m: 2
    front_aisle_cells: 0
    row_aisle_cells: 0
    decor: [nat_tree, nat_tree_oak, nat_tree_pine, nat_bush, nat_rock, prop_street_light, prop_traffic_cone]

# Sites et routes. Délai d'un fournisseur = préparation + arrondi au-dessus (km / vitesse / heures de conduite par
# jour), borné 1 à 8 ; valeurs et provenance : values reseau.* (classes par défaut : 1, 3 et 5 jours, ceux des
# profils). `map` ne fait que la mise en page de la carte (60 m par anneau, routes à 5 m des bâtiments).
network:
  map: {cell_m: 60, road_offset_m: 5}
  driving_h_per_day: 9
  distance_classes:
    proche: {label: Proche (250 km), km: 250, ring: 1}
    national: {label: National (800 km), km: 800, ring: 2}
    import: {label: Import (1 300 km), km: 1300, ring: 3}
  link_types:
    route: {label: Route, speed_kmh: 70, vehicle: veh_box_truck}
  sites:
    fournisseur_rapide: {kind: fournisseur, side: ouest, link: route, distances: [proche], default: proche, prep_days: 0, supplier_profile: rapide, building: bld_warehouse}
    # Standard en `proche` seulement (21/11/2026, D9 c) : en `national` (délai 4 j), le pilote, qui commande au
    # standard, manque le critère ruptures en équilibré (2 jours-ligne à 1 ligne, 6 à 3) et en expert à 3 lignes
    # (9 à 11), graines 5 à 8 ; aucune variante essayée (couverture, marge, stock de départ) ne le rattrapait.
    fournisseur_standard: {kind: fournisseur, side: ouest, link: route, distances: [proche], default: proche, prep_days: 2, supplier_profile: standard, building: bld_factory_plant}
    fournisseur_economique: {kind: fournisseur, side: ouest, link: route, distances: [national, import], default: national, prep_days: 3, supplier_profile: economique, building: bld_warehouse_hangar}
    client: {kind: client, side: est, link: route, distances: [proche], default: proche, prep_days: 0, building: bld_distribution_center}

# Règles de placement contrôlées par check_placement. Provenance obligatoire : `source` (citation lue dans une fiche
# du corpus), `calibre` (la note dit pourquoi c'est plausible) ou `exemple` (cahier, non sourcé). Les postes
# « séparés des flux chariots par des protections fixées au sol » (INRS ED 6350, § 4.4, p. 14-15) sont contrôlés
# par `protected_path` (postes_proteges_chariots). Non déclarées (annexe 0010 §8 et §12, justification du
# 19/11/2026), fiche inrs-implantation-plateformes-logistiques :
#  - flux VL et PL dissociés, piétons qui ne croisent « qu'une seule fois » les voies PL (§ 4.1, p. 10-11) : le jeu
#    n'a ni VL ni piéton ; `crossings_max: 1` sur la voie PL compterait les croisements de routes, pas de piétons ;
#  - PL en sens unique (§ 4.1, p. 10) : `one_way` cherche un lien de b vers a, or le placeur ne trace que des liens
#    site -> usine (layout.py) ; la règle serait toujours vraie et n'enseignerait rien ;
#  - transbordement sans chariot (`crossings_max: 0`) : la fiche dit l'inverse (« une circulation de chariots
#    parallèle aux portes de quais », § 4.4) ; ce sont les piétons qui ne doivent pas couper les chariots.
placement_rules:
  - id: allee_chariot_inrs
    kind: aisle_min
    min_m: 2.15
    status: source
    citation: >-
      INRS ED 949, § 2.2.2, p. 19-20, et ED 6350, annexe 3, p. 38 (fiche inrs-allees-chariots-et-pietons) : allée à
      sens unique = largeur du chariot (ou de sa charge) + 1 m ; double sens = largeur des deux + 1,40 m ; passage
      piéton d'au moins 0,80 m séparé par un garde-corps.
    note: "2,15 m = largeur du chariot veh_forklift (1,15 m, ai/assets.yaml) + 1 m, sens unique."
  - id: allees_chariot
    kind: aisle_min
    min_m: 2.5
    status: calibre
    note: >-
      2,5 m n'est pas dans la source : c'est 5 cellules, la plus petite allée du plan, au-dessus des 2,15 m de la règle
      INRS à sens unique. Le double sens (2 chariots : 3,70 m ; chariot et transpalette : 3,10 m) et le passage piéton
      séparé ne sont pas garantis : allées à sens unique, à vérifier avant d'y voir un plan réel.
  - id: marche_en_avant
    kind: flow
    blocks: [reception, stock_mp, production, qualite, emballage, entrepot_pf, quai]
    status: exemple
    note: "Ordre du cahier (plan en U) ; l'expression et l'ordre ne sont pas dans INRS ED 6350 (fiche inrs-implantation-plateformes-logistiques, « Ce que la source NE dit pas »)."
  - id: quai_reception
    kind: adjacent
    a: reception
    b: quai
    status: exemple
    note: "Cahier : quai partagé réception et expédition ; contiguïté non énoncée par la source lue (INRS ED 6350)."
  - id: quai_entrepot_pf
    kind: adjacent
    a: entrepot_pf
    b: quai
    status: exemple
    note: "Cahier : l'entrepôt PF charge le camion du client au quai partagé ; non énoncé par la source lue."
  - id: quarantaine_separee
    kind: separated
    a: quarantine
    b: mp
    min_m: 2.5
    status: calibre
    note: >-
      Quarantaine des palettes non conformes (ref quarantine) à une allée au moins des racks MP (ref mp), pour qu'une
      palette bloquée ne soit pas rangée ni consommée par erreur. Maîtrise des éléments de sortie non conformes : ISO
      9001, § 8.7, non lue (à vérifier) ; 2,5 m = une allée du plan.
  - id: ecran_indicateurs
    kind: facing
    block: pilotage
    role: affichage
    toward: front
    status: calibre
    note: "Mise en scène : un écran se lit de face, depuis l'allée où l'on passe ; aucune source, n'entre dans aucun calcul."
  - id: postes_proteges_chariots
    kind: protected_path
    a: production
    b: entrepot_pf
    barrier: true
    one_way: false
    crossings_max: 0
    status: source
    citation: >-
      INRS ED 6350, § 4.4, p. 15 (fiche inrs-implantation-plateformes-logistiques) : les zones de travail
      (conditionnement, marquage, contrôle) sont « séparées des flux chariots par des protections fixées au sol ».
    note: >-
      Chemin des chariots de la production à l'entrepôt PF, qui longe le contrôle (qualite) et le conditionnement
      (emballage). Valeurs de calibrage, non sourcées : bande de 1,5 m de part et d'autre du chemin où un poste
      exige une barrière (PROTECT_M du moteur) ; crossings_max 0 = aucune route de camion ne coupe ce chemin
      intérieur (transposition des flux dissociés du § 4.1, p. 10, la source ne chiffre rien pour les chariots).

# --- Campus : plusieurs bâtiments et pièces (ADR 0013, tranche T5 ; annexe 0013 §2 et §2 bis) ------------------------
# Lu par layout.place_campus quand le plan compte 2 bâtiments ou plus. buildings absent ou 1 : place_world actuel (hall
# en U de 48 x 30 m, template usine), sans vitesse de trajet : le jeu de référence ne change pas.
# Un bâtiment séparé n'est permis que si le moteur chronomètre ce qui le relie au reste (ADR 0013 §2 et §6.7). Liaisons
# chronométrées (layout.TIMED_LINKS, fixées par le code, annexe §2 bis décision 3) : kit (stock_mp -> production,
# chariot), technicien (maintenance -> production, à pied) et palette filmée (emballage -> entrepot_pf, chariot,
# décision 2) ; tout autre passage est instantané (quai <-> réception, réception -> racks MP, ligne -> contrôle ->
# emballage). D'où trois archétypes : le hall, l'entrepôt (logistique) et l'atelier de maintenance.
# Non déclarés, faute de trajet calculé : bureaux séparés (le pilotage n'a aucun flux simulé) et laboratoire qualité
# (contrôle produit par produit, sans trajet) ; ils restent des pièces du hall.
# `rooms.<kind>.blocks` = ids de départements (annexe 0013 §2), pas les `block_types` ci-dessus.
# Tailles en cellules de campus.cell_m : provenance values campus.tailles_batiments. Bâtiments en rangée, quais
# alignés côté camions (bord z max) ; entrée au milieu du bord opposé aux camions (z min), spawn 2 m devant celle de b1.
# `walls` et `door` : ids d'assets du catalogue (ai/assets.yaml, préfixe prop_ imposé), recopiés dans Building.walls et
# Building.door. prop_wall_panel : module de 4 m, variantes style (bardage | brique) et hauteur (6 : façade, 3 :
# cloison). prop_door_industrial : variante type (sectionnelle 4 x 4 m, engins et camions ; pietonne : cadre de 1 x
# 2,1 m posé dans une ouverture de mur) et ouverte. Building.style = matériau du mur, tiré dans
# ambiances[world.ambiance].styles (un style n'est pas un asset). Sol des pièces : prop_floor_slab (beton | resine),
# hors contrat Building (choix de Godot).
campus:
  cell_m: 4                 # values campus.cellule_m
building_archetypes:
  hall_production:
    label: Hall de production
    size_cells: [[10, 6], [15, 11]]  # 40 x 24 m sans la logistique (entrée hors du bureau) ; 48 x 32 m s'il la loge
    rooms:
      atelier: {label: Atelier de fabrication, blocks: [production, qualite, emballage]}
      logistique: {label: Zone logistique, blocks: [reception, quai, stock_mp, entrepot_pf]}
      maintenance: {label: Maintenance, blocks: [maintenance]}
      bureau: {label: Bureaux du pilotage, blocks: [pilotage]}
    walls: prop_wall_panel
    door: prop_door_industrial
  entrepot:
    label: Entrepôt logistique
    size_cells: [[9, 6], [12, 8]]    # 36 x 24 m : réception, quai, 24 places MP et 20 places PF ; 48 x 32 m au plus
    rooms:
      logistique: {label: Réception, stocks et expédition, blocks: [reception, quai, stock_mp, entrepot_pf]}
    walls: prop_wall_panel
    door: prop_door_industrial
  atelier_maintenance:
    label: Atelier de maintenance
    size_cells: [[3, 2], [5, 4]]     # 12 x 8 m (établi, tableau, rechanges) à 20 x 16 m
    rooms:
      maintenance: {label: Atelier de maintenance, blocks: [maintenance]}
    walls: prop_wall_panel
    door: prop_door_industrial

# Règles de zonage (types de spec.ZONING_KINDS), contrôlées par layout.check_placement. Deux départements dans la même
# pièce satisfont `together`. Les `together` suivent les passages que le moteur ne chronomètre pas (voir campus).
zoning_rules:
  - type: together
    departments: [reception, quai]
    provenance: {status: calibre, note: "Déchargement compté au quai (reception.dechargement_min_palette), sans trajet vers la réception : les séparer montrerait un trajet que le moteur ne calcule pas (ADR 0013 §6.7). Même contiguïté que placement_rules.quai_reception (exemple, cahier)."}
  - type: together
    departments: [entrepot_pf, quai]
    provenance: {status: calibre, note: "Chargement du camion client compté au quai (entrepot_pf.chargement_min_palette), sans trajet depuis les racks PF. Même contiguïté que placement_rules.quai_entrepot_pf (exemple, cahier)."}
  - type: together
    departments: [reception, stock_mp]
    provenance: {status: calibre, note: "Rangement des palettes reçues instantané dans le moteur (pas de trajet du chariot réception -> racks) : réception et stock MP restent voisins."}
  - type: together
    departments: [production, qualite]
    provenance: {status: calibre, note: "Chaque produit passe de la dernière machine au contrôle sans trajet (machine.transfer_min = 0 au dernier rang) : contrôle collé aux lignes."}
  - type: together
    departments: [qualite, emballage]
    provenance: {status: calibre, note: "Produit conforme passé à l'emballage sans trajet : emballage voisin du contrôle. Ordre du flux : placement_rules.marche_en_avant (exemple)."}
  - type: apart
    departments: [pilotage, quai]
    provenance:
      status: calibre
      note: >-
        Transposition, non une citation : INRS ED 6350 (oct. 2019, fiche inrs-implantation-plateformes-logistiques)
        place les parkings VL près des bureaux, isolés des flux PL (§ 4.1, p. 10), et des locaux sociaux sur une zone
        isolée de toute circulation de chariots (§ 4.4, p. 15) ; ces bureaux ne sont pas nommés. Le jeu en tire :
        bureaux du pilotage loin du quai des camions (2 cellules, 8 m, au moins). Hall en U : 19,5 m, déjà tenu.
  - type: max_walk_m
    departments: [maintenance, production]
    value: zonage.marche_max_maintenance_m
    provenance: {status: calibre, note: "Voir values zonage.marche_max_maintenance_m."}

# Ambiances (clé du contrat depuis T2 : annexe 0013 §1 GameParams.ambiance, §2 et §2 bis décision 1) : décor seul,
# aucun calcul. styles = matériaux de façade permis (variante style de prop_wall_panel). palette, season et vegetation
# limitées à reference, ete et normale (aspect actuel) tant que Godot n'en rend pas d'autre.
ambiances:
  zone_industrielle: {label: Zone industrielle, palette: reference, season: ete, vegetation: normale, styles: [bardage, brique]}

clock:
  days_per_turn: 5
  minutes_per_day: 480
  day_start_h: 8
  frame_min: 5
  breaks: [[120, 10], [240, 20], [360, 10]]   # 10 h 00, 12 h 00 (20 min), 14 h 00 ; voir pilotage.pauses

limits:                  # [min, max, défaut], format de `ranges` (annexe §1, 29/10) ; défauts = jeu de référence
  weeks: [4, 12, 6]
  products: [1, 1, 1]    # bloqué à 1 jusqu'à T4b (moteur mono-produit) ; cible [1, 3, 1], values limites.produits
  suppliers: [3, 8, 3]   # values limites.fournisseurs
  clients: [1, 1, 1]     # bloqué à 1 jusqu'à T4b (moteur mono-client) ; cible [1, 4, 1], values limites.clients
  buildings: [1, 3, 1]   # values limites.batiments ; 1 = hall en U du jeu de référence, 2 ou 3 = campus

params:
  - {id: lines, label: Lignes de production, type: int, min: 1, max: 3, default: 2}

# Facteurs appliqués aux valeurs de référence (machine_types, fournisseur standard). Tous `calibre` : voir
# machine.facteur_mtbf, qualite.facteur_defauts, client.charge, client.delai_promis_jours, client.variabilite,
# fournisseur.ecart_fiabilite, stock_mp.stock_initial_jours, entrepot_pf.stock_initial_jours,
# pilotage.tresorerie_initiale_semaines.
difficulties:
  decouverte:
    label: Découverte
    detail: machines fiables, goulot qui s'use (le préventif se voit), peu de défauts, stocks confortables, usine chargée à 80 %
    mtbf_factor: 1.5
    bottleneck_shape: 3    # forme de Weibull du goulot (machine.weibull_shape, P2 du 19/11 ; fiche nist-sematech-weibull : > 1 = taux de panne croissant avec l'âge) : usure marquée
    defect_factor: 0.5
    load: 0.80
    promised_days: 2
    demand_variability: 0.05
    reliability_shift: 3
    mp_stock_days: 5
    pf_stock_days: 1.2
    cash_weeks: 6
    # Pitch (D4, audit du 19/11) : moteur-jeu joint, dans l'ordre de ces clés, le fragment du profil réellement
    # appliqué à chaque clé (tunings, sinon le niveau) ; un fragment vide est omis. Valeurs reprises des clés ci-dessus.
    fragments:
      mtbf_factor: machines plus fiables
      bottleneck_shape: goulot qui s'use
      defect_factor: moins de défauts
      reliability_shift: fournisseurs plus fiables
      demand_variability: demande plus régulière
      mp_stock_days: 5 jours de matière en stock
      pf_stock_days: 1,2 jour de produits finis en stock
      load: usine chargée à 80 %
      promised_days: livraison promise à J+2
  equilibre:
    label: Équilibré
    detail: valeurs du cahier, usine chargée à 85 %
    mtbf_factor: 1.0
    bottleneck_shape: 2    # comme les autres machines
    defect_factor: 1.0
    load: 0.85
    promised_days: 2
    demand_variability: 0.10
    reliability_shift: 0
    mp_stock_days: 4
    pf_stock_days: 1.0
    cash_weeks: 4
    fragments:  # profil de référence : pannes, défauts, fournisseurs et demande sans comparatif
      mtbf_factor: ""
      bottleneck_shape: ""
      defect_factor: ""
      reliability_shift: ""
      demand_variability: ""
      mp_stock_days: 4 jours de matière en stock
      pf_stock_days: 1 jour de produits finis en stock
      load: usine chargée à 85 %
      promised_days: livraison promise à J+2
  expert:
    label: Expert
    detail: pannes plus fréquentes, pannes du goulot au hasard, plus de défauts, stocks bas, usine chargée à 92 %, livraison à J+1
    mtbf_factor: 0.6
    bottleneck_shape: 1    # pannes au hasard (fiche nist-sematech-weibull l.68-69 : forme 1 = modèle exponentiel, taux constant) : le préventif du goulot n'évite rien (notion pannes_par_usure)
    defect_factor: 1.5
    load: 0.92
    promised_days: 1
    demand_variability: 0.15
    reliability_shift: -8
    mp_stock_days: 2.5
    pf_stock_days: 0.5
    cash_weeks: 3          # 2,5 au 05/11 : à une ligne, le pilote manquait de trésorerie pour recommander (19/11)
    fragments:
      mtbf_factor: pannes plus fréquentes
      bottleneck_shape: pannes du goulot au hasard
      defect_factor: plus de défauts
      reliability_shift: fournisseurs moins fiables
      demand_variability: demande plus variable
      mp_stock_days: 2,5 jours de matière en stock
      pf_stock_days: une demi-journée de produits finis en stock
      load: usine chargée à 92 %
      promised_days: livraison promise à J+1

# Réglages que la conception par l'IA peut choisir (ADR 0008, annexe §2) : une clé de profil prend la valeur d'un
# autre profil de `difficulties`, jamais un nombre nouveau ; provenance dans `values` (liste ci-dessus).
# `cash_weeks` n'est pas réglable : aucune notion du pack ne porte sur la trésorerie (pas de module finance).
# `value` : clé de `values` qui porte la provenance du réglage (arbitrage e).
tunables:
  mtbf_factor: {label: Fréquence des pannes, value: machine.facteur_mtbf, teaches: [disponibilite, pannes_par_usure, maintenance_preventive]}
  bottleneck_shape: {label: Usure du goulot, value: machine.weibull_shape, teaches: [pannes_par_usure, maintenance_preventive]}
  defect_factor: {label: Défauts des machines, value: qualite.facteur_defauts, teaches: [rendement_en_cascade, capacite_et_trs]}
  load: {label: Charge de l'usine, value: client.charge, teaches: [charge_et_attente, goulot, loi_de_little]}
  promised_days: {label: Délai promis au client, value: client.delai_promis_jours, teaches: [otif, loi_de_little]}
  demand_variability: {label: Variabilité de la demande, value: client.variabilite, teaches: [stock_de_securite, charge_et_attente]}
  reliability_shift: {label: Fiabilité des fournisseurs, value: fournisseur.ecart_fiabilite, teaches: [delai_et_fiabilite, stock_de_securite]}
  mp_stock_days: {label: Stock de matière au départ, value: stock_mp.stock_initial_jours, teaches: [point_de_commande, stock_de_securite]}
  pf_stock_days: {label: Stock de produits finis au départ, value: entrepot_pf.stock_initial_jours, teaches: [otif, stock_de_securite]}

targets:
  otif: 95            # % de commandes livrées complètes au plus tard le jour promis
  trs: 80             # % moyen des lignes (voir pilotage.objectif_trs ; 78 jusqu'au 19/11/2026)
  stockouts: 0        # jours-ligne arrêtés faute de matière, sur toute la partie (voir criteria.stockouts)
  cash_share: 0.6     # trésorerie finale >= départ + 60 % du gain du pilote automatique (règle de l'atelier)

# Critères du bilan (annexe 0010 §3), lus par generation.apply_rules : partiel = cible décalée de `margin` du côté
# raté ; sans marge, atteint ou non atteint. Marges `calibre`, mesurées le 05/11/2026 au pilote automatique
# (graines 5 à 8, 6 semaines, 2 lignes, trois modules) et au joueur passif (aucune action).
criteria:
  otif:
    margin: {decouverte: 5, equilibre: 5, expert: 5}
    status: calibre
    note: "Partiel de 90 à 95 % : l'écart de 5 points de la pastille (values.interface.seuils_attention). Pilote : 96,7 à 100 % ; passif : 0 à 5,5 % (non atteint)."
  trs:
    margin: {decouverte: 5, equilibre: 5, expert: 5}
    status: calibre
    note: "Partiel de 75 à 80 %. Mesure du 19/11/2026 (TRS hors pauses, graines 5 à 8, 1 et 3 lignes) : pilote 82,7-92,0 % à une ligne, 79,5-82,3 % à trois lignes (partiel seulement en équilibré à 3 lignes) ; joueur qui lance un OF par jour sans campagne : 78,5-83 % (partiel ou atteint) ; passif : 0 %."
  stockouts:
    margin: {decouverte: 2, equilibre: 2, expert: 6}
    # D9 (b), codé (apply_rules) : marge donnée pour `margin_lines` lignes ; partiel = cible + marge x nombre de
    # lignes ÷ margin_lines (expert : 3 jours-ligne à 1 ligne, 9 à 3 lignes). Expert 4 -> 5 le 19/11/2026, 5 -> 6
    # le 21/11/2026 (D9 d : J09, graine 909, 3 jours-ligne à une ligne, un matin de camion sur trois jours).
    margin_lines: 2
    status: calibre
    note: >-
      Compte attendu de moteur-jeu : somme de history[].stockouts sur toute la partie (jours-ligne arrêtés faute de
      matière), et non plus la dernière semaine ; non atteint si aucun produit n'est sorti de la partie (good_share
      None chaque semaine), sinon le joueur passif, qui n'a jamais lancé d'OF, l'atteindrait. Partiel : 2 jours-ligne
      (un jour sur les deux lignes), 6 en expert, pour 2 lignes. Calibrage valable pour le fournisseur standard à la
      distance proche (délai 3 j), seule permise (network.sites.fournisseur_standard) ; la distance de l'économique
      (national ou import) ne change rien, le pilote ne commande qu'au standard. Pilote mesuré le 21/11/2026
      (graines 5 à 8, 1 et 3 lignes, partie de référence et jeux J01 à J10 du second tour) : 0 en découverte, 0 à 1
      en équilibré ; en expert, 0 à 3 à une ligne (3 = J02 et J08, graine 5, partiel avec 6 et non atteint avec 5),
      0 à 7 à trois lignes (semaine 1 : stock de départ et commande initiale couvrent 4 jours pour un délai de 3
      jours, souvent tenu à un jour près), partiel au pire ; J09, graine 909 : 3 à une ligne. En national (4 j),
      retiré : 2 à une ligne et 6 à trois en équilibré, 9 à 11 à trois lignes en expert.
  cash:
    partial_share: 0
    status: calibre
    note: >-
      Lu par generation.apply_rules : partiel = initial_cash + partial_share x gain du pilote, soit finir sans perdre
      d'argent ; sans partiel si le gain est nul. Pilote : 96 802 à 206 146 € pour des cibles de 66 000 à 154 200 € ; passif : sous la trésorerie de départ.

# Règles à cocher (annexe 0010 §6), gabarits lus par generation.apply_rules (clés : weeks, company, otif, trs,
# stockouts, cash_final, initial_cash). Seulement des mécaniques que le moteur applique ; la règle d'annulation de
# commande n'est pas publiée (décision de l'utilisateur : plus tard). 200 caractères au plus après substitution.
game_rules:
  - id: objectifs
    text: "En {weeks} semaines : OTIF (à l'heure et complet) moyen d'au moins {otif:g} %, TRS (rendement des lignes) moyen d'au moins {trs:g} %, au plus {stockouts:g} jour-ligne sans matière, trésorerie finale d'au moins {cash_final} €."
  - id: otif_par_commande
    text: "Une commande compte pour l'OTIF si elle part complète au plus tard le jour promis ; l'OTIF de la semaine est la part de ces commandes."
    citation: "Fiche wikipedia-en-supply-chain-operations-reference (SCOR) : livraisons à temps et en totalité à la date promise, comptées ici par commande."
  - id: trs_par_ligne
    text: "Le TRS d'une ligne vaut les produits bons fois leur temps de cycle idéal, divisés par le temps planifié hors pauses (convention du jeu) ; objectif : moyenne des lignes et des semaines."
    citation: "Fiche wikipedia-fr-taux-de-rendement-synthetique : TRS = Tb x Tf x Tq (l.40) ; une pause compte comme un arrêt ou réduit le temps d'ouverture selon les organisations (l.48)."
  - id: ruptures_jours_ligne
    text: "Une ligne arrêtée faute de matière au cours d'un jour compte un jour-ligne ; le bilan les additionne sur la partie, et une usine qui ne produit rien manque ce critère."
  - id: matiere_payee_reception
    text: "La matière est payée à la réception des palettes acceptées ; une palette mise en quarantaine n'est pas payée."
  - id: camion_six_palettes  # règle du jeu, sans citation : valeur dans values.fournisseur.camion_palettes (exemple, non sourcée)
    text: "Une commande de matière est un camion de 6 palettes au plus."
  - id: alea_annonce
    text: "Chaque aléa est annoncé une semaine à l'avance : il reste un tour pour s'y préparer."
  - id: pilote_automatique
    text: "Un module sans joueur est tenu par le pilote automatique : point de commande, lancement d'OF par campagne, préventif sur le goulot."

# Alertes de l'usine (annexe 0010 §2), lues par factory_game._alerts (une alerte absente d'ici n'est pas émise),
# sauf cash_negative et event, encore écrites en dur par engine.common_alerts (annexe 0010 §12, moteur-jeu). Seuils
# et textes ne prennent que des faits calculés par le moteur ({clés} = champs de la vue) ; 120 caractères au plus
# après substitution. Pas d'alerte d'usure : aucun seuil sourcé.
alerts:
  - id: reorder
    level: warning
    department_id: stock_mp
    module_id: pilotage
    when: "palettes en stock + palettes commandées < point de commande (stocks.mp[0])"
    text: "Matière : {pallets} palettes en stock, {pending} en commande, point de commande {reorder_point}."
    action: {action_id: commander_mp, values: {offer: standard, pallets: "min(6, place libre au magasin)"}}
    status: source
    citation: "Notion point_de_commande (fiche wikipedia-en-reorder-point) ; point = délai + revue 1 jour + stock de sécurité (values.stock_mp.stock_securite_jours, calibre)."
  - id: starved
    level: critical
    department_id: stock_mp
    module_id: pilotage
    when: "stockout_min > 0 sur une ligne la semaine passée"
    text: "{line} arrêtée {stockout_min} min faute de matière."
    status: calibre
    note: "Fait mesuré par le moteur, sans seuil : toute minute arrêtée faute de matière déclenche l'alerte."
  - id: breakdown
    level: warning
    department_id: maintenance
    module_id: maintenance
    when: "machine à l'état panne, hors goulot de sa ligne"
    text: "{machine} en panne."
    action: {action_id: priorite_reparation, values: {ordre: goulot}, unless: "priorité déjà au goulot"}
    status: calibre
    note: "Fait du moteur, sans seuil ; niveau warning : une panne hors goulot ne réduit pas d'emblée le débit de la ligne (notion goulot)."
  - id: breakdown_goulot
    level: critical
    department_id: maintenance
    module_id: maintenance
    when: "goulot de sa ligne à l'état panne (machines[].bottleneck)"
    text: "{machine} en panne : c'est le goulot."
    action: {action_id: priorite_reparation, values: {ordre: goulot}, unless: "priorité déjà au goulot"}
    status: source
    citation: "Notion goulot (fiche wikipedia-fr-theorie-des-contraintes) : chaque heure perdue par la contrainte est perdue pour la ligne."
  - id: trs_low
    level: warning
    department_id: production
    module_id: production
    when: "TRS de la ligne la semaine passée < threshold (factory_game._alerts lit threshold)"
    threshold: 73
    text: "TRS de {line} à {trs} % la semaine passée, sous le seuil d'attention de 73 %."
    status: calibre
    note: "73 = seuil d'attention d'une semaine, 7 points sous la cible de 80 et sous la zone partielle du critère TRS (75-80, moyenne de la partie) : l'alerte signale une chute nette d'une semaine, pas un écart ordinaire. Sans action : la cause (panne, rupture, défauts) a sa propre alerte."
  - id: late
    level: warning
    department_id: client
    module_id: null
    when: "commande de la semaine passée livrée après le jour promis (3 au plus)"
    text: "Commande client {order} livrée en retard."
    status: source
    citation: "Notion otif (fiche wikipedia-en-supply-chain-operations-reference)."
  - id: cash_negative
    level: critical
    department_id: pilotage
    module_id: null
    when: "trésorerie < 0 (engine.common_alerts) ; l'action « decouvert » du module finance ne s'applique pas ici"
    text: "Trésorerie négative : {cash} €."
    status: calibre
    note: "Fait du moteur, sans seuil ; aucun agio n'est compté dans l'usine, n'en annoncer aucun."
  - id: event
    level: info
    department_id: null
    module_id: null
    when: "aléa tiré pour la semaine suivante (engine.common_alerts)"
    text: "Aléa annoncé pour la semaine qui vient : {title}."
    status: calibre
    note: "Annonce une semaine à l'avance, règle du jeu (docs/game-design.md)."

values:
  # --- Fournisseur (cahier §2) ---------------------------------------------------------------------------
  fournisseur.delai_jours: {value: 3, unit: jour, status: exemple, note: "Cahier §2, délai de livraison ; profil standard."}
  fournisseur.fiabilite_delai: {value: 0.95, unit: part des livraisons à l'heure, status: exemple, note: "Cahier §2 ; profil standard."}
  fournisseur.taux_non_conforme: {value: 0.02, unit: part des palettes reçues, status: exemple, note: "Cahier §2 (« livraisons non conformes ») ; appliqué palette par palette, la palette part en quarantaine."}
  fournisseur.commande_min_palettes: {value: 1, unit: palette, status: exemple, note: "Cahier §2 ; profils rapide et standard."}
  fournisseur.camion_palettes: {value: 6, unit: palette, status: exemple, note: "Cahier §2 : camion de 4 à 6 palettes ; le maximum borne une commande (une commande = un camion)."}
  fournisseur.creneau_livraison_min: {value: [0, 120], unit: minute depuis 8 h, status: exemple, note: "Cahier §2 : créneau 8 h - 10 h."}
  fournisseur.stock: {value: illimite, status: exemple, note: "Cahier §2 : stock du fournisseur illimité par défaut."}
  fournisseur.retard_jours: {value: 1, unit: jour, status: calibre, note: "Une livraison en retard arrive le jour ouvré suivant ; le cahier ne dit pas de combien."}
  fournisseur.profils:
    value:
      rapide: {lead_days: 1, reliability: 97, cost_factor: 1.12, min_pallets: 1}
      standard: {lead_days: 3, reliability: 95, cost_factor: 1.0, min_pallets: 1}
      economique: {lead_days: 5, reliability: 85, cost_factor: 0.88, min_pallets: 4}
    unit: jour, % à l'heure, facteur de prix, palettes
    status: calibre
    note: >-
      Standard = fournisseur du cahier. Arbitrage voulu : le rapide coûte 12 % de plus ; l'économique coûte 12 %
      de moins mais livre en 5 jours, moins souvent à l'heure et par 4 palettes, ce qui demande plus de stock de
      sécurité et peut saturer les 24 places de racks à 3 lignes. Écarts indicatifs, non sourcés. Ordre des fournisseurs
      d'un produit (themes) = ordre des profils.
  fournisseur.ecart_fiabilite: {status: calibre, note: "difficulties.reliability_shift : points ajoutés à la fiabilité des trois profils (+3, 0, -8), plafonnée à 100."}

  # --- Réception (cahier §3.1) ---------------------------------------------------------------------------
  reception.dechargement_min_palette: {value: 2, unit: min par palette, status: exemple, note: "Cahier §3.1."}
  reception.controle_min_palette: {value: 5, unit: min par palette, status: exemple, note: "Cahier §3.1."}
  reception.zone_depose_palettes: {value: 6, unit: palette, status: exemple, note: "Cahier §3.1 (décor et file d'attente du contrôle)."}
  reception.quarantaine_palettes: {value: 2, unit: palette, status: exemple, note: "Cahier §3.1."}
  reception.quais: {value: 1, unit: camion à la fois, status: exemple, note: "Cahier §3.1 : un quai partagé avec l'expédition (décision de l'utilisateur du 28/10/2026)."}

  # --- Stock MP (cahier §3.2) ----------------------------------------------------------------------------
  stock_mp.capacite_palettes: {value: 24, unit: palette, status: exemple, note: "Cahier §3.2 : racks de 24 emplacements."}
  stock_mp.chariots: {value: 1, unit: chariot, status: exemple, note: "Cahier §3.2 : chariot de 1 200 kg (batterie : tranche 2)."}
  stock_mp.kit_min: {value: 8, unit: min par kit, status: calibre, note: "Cahier sans valeur : prélever la matière d'un lot de 24 et la livrer en tête de ligne. Indicatif ; à 3 lignes, environ 15 kits par jour occupent le chariot 2 h."}
  stock_mp.sortie_fifo: {value: FIFO, status: exemple, note: "Cahier §3.2 : sortie dans l'ordre d'arrivée. Pratique décrite par wikipedia-en-stock-rotation (notion rotation_fifo)."}
  stock_mp.commande_initiale:
    value: {offer: standard, cover_extra_days: 1}
    unit: profil du fournisseur, jour ajouté au délai
    status: calibre
    note: >-
      D9 (a), codé (factory_generation._initial_order) et mesuré le 19/11/2026 ; choix de calibrage, non sourcé.
      Calibrage valable pour le fournisseur standard à la distance proche (délai 3 j), seule permise depuis le
      21/11/2026 : en national (4 j), ni cover_extra_days 2, ni deux camions au départ, ni 3,5 j de stock en expert
      ne gardaient le pilote sous le partiel des ruptures (J02, graines 202 et 5 à 8 : 9 à 11 jours-ligne à 3 lignes).
      cover_extra_days 2 a été essayé : il supprime les ruptures de semaine 1 en expert, mais donne à l'équilibré
      (4 j < 3 + 2) une commande qui arrive au jour 4, quand le stock s'épuise, et qui retarde la première commande
      du pilote (ruptures en équilibré) : 1 gardé. Seulement si mp_stock_days < délai + cover_extra_days (comparaison en jours, sans arrondi) : au
      départ, une commande `offer` déjà en route de min(fournisseur.camion_palettes, place libre du magasin,
      ceil(round((délai + cover_extra_days - mp_stock_days) x conso, 2))) palettes, conso = mp_day ÷ unités par palette
      (toutes lignes, rendement compris), arrivée au jour floor(mp_stock_days), payée à la réception. Découverte (5 j) et
      équilibré (4 j) : aucune, délai standard 3 + 1 = 4. Expert, J01 (2 000 u./sem., 5 j, 120 u./palette, rendement
      omis, conso 3,33) : (4 - 2,5) x 3,33 = 5 palettes, arrivée au jour 2 ; le stock reste bas sans rupture certaine.
  stock_mp.stock_securite_jours:
    value: 2
    unit: jour de consommation
    status: calibre
    note: >-
      Pilote automatique : point de commande = consommation pendant (délai du fournisseur standard + période de
      révision de 1 jour + ce stock de sécurité). En révision périodique, la couverture vaut délai + période de
      révision (wikipedia-en-safety-stock, § Inventory policy). Le moteur lit cette valeur (factory.mp_safety_days) :
      point = délai + 1 + 2 jours. 1 jour jusqu'au 19/11/2026 ; 2 mesurés ce jour-là (standard proche) : en expert à 3 lignes, 0 à 7
      jours-ligne sans matière au lieu de 0 à 27 (partie de référence et jeux J01 à J10, graines 5 à 8) ; 1,5 laisse des ruptures en équilibré à une ligne. La formule de la
      fiche (l. 31, SS = z x racine(E(L) sigma_D² + E(D)² sigma_L²)) donne environ 0,6 jour en expert à 95 % (z = 1,65 ;
      393 unités par jour, ± 15 % ; délai 3 jours, en retard d'un jour 13 fois sur 100) : l'écart couvre ce que la
      formule ignore ici, les palettes en quarantaine, un seul camion par commande livré entre 8 h et 10 h, après le
      démarrage des lignes, et les achats bornés par la trésorerie. Choix de calibrage, non sourcé.
  stock_mp.stock_initial_jours: {status: calibre, note: "difficulties.mp_stock_days (5, 4, 2,5 jours de consommation) : au plus 15 palettes à 3 lignes, sous les 24 places."}
  stock_mp.unites_par_palette: {status: calibre, note: "themes.*.mp.units_per_pallet (120 à 150) : à 3 lignes, environ 3 palettes consommées par jour, un camion de 6 tous les 2 jours, racks de 24 suffisants ; kits de quelques kilos, palette sous les 1 200 kg du chariot. Indicatif."}

  # --- Machines (cahier §5.2 ; nombres dans machine_types) -----------------------------------------------
  machine.cycle_min: {status: exemple, note: "Cahier §5.2 : 2 ; 1,5 ; 3 ; 1 min. M3 est le goulot (20 / h)."}
  machine.mtbf_h: {status: exemple, note: "Cahier §5.2 : 40, 80, 60, 100 h. Convention du jeu (maintenance.convention_mtbf) : temps moyen de marche entre deux pannes, réparation exclue."}
  machine.mttr_h: {status: exemple, note: "Cahier §5.2 : 1 ; 0,5 ; 1 ; 0,5 h de réparation active ; l'arrêt réel ajoute l'attente et le trajet du technicien."}
  machine.weibull_shape:
    status: calibre
    note: >-
      Forme 2 : risque de panne croissant avec l'âge (usure), pour que le préventif ait un effet, comme sur une
      machine qui s'use (wikipedia-en-reliability-centered-maintenance : le préventif ne vaut que si l'équipement
      s'use). Le goulot prend la forme du profil (difficulties.bottleneck_shape : 3, 2, 1) : usure marquée en
      découverte, pannes au hasard en expert (forme 1 = loi exponentielle, taux constant), où le préventif du goulot
      n'évite rien ; valeurs 1, 2, 3 = choix de calibrage, non sourcés. Loi de Weibull : fiche nist-sematech-weibull
      (NIST appelle gamma la forme) : forme 1 = modèle exponentiel, taux de panne constant (l.68-69) ; taux de panne
      polynomial d'exposant forme - 1 (l.77-78), donc croissant avec l'âge si la forme dépasse 1 (déduction de la
      formule, l.30 ; le texte ne dit pas « usure »).
  machine.facteur_mtbf: {status: calibre, note: "difficulties.mtbf_factor (1,5 ; 1 ; 0,6) appliqué aux MTBF du cahier."}
  machine.setup_min: {status: exemple, note: "Cahier §5.2 : 10, 5, 0, 5 min à chaque changement de lot (aucun sur le goulot)."}
  machine.defect_rate: {status: exemple, note: "Cahier §5.2 : 2 %, 1 %, 3 %, 2 % ; rendement cumulé de la ligne = 98 x 99 x 97 x 98 % = 92,2 %."}
  machine.buffer: {status: exemple, note: "Cahier §5.2 : table d'attente de 10 produits en sortie de chaque machine."}
  machine.transfer_min: {status: exemple, note: "Cahier §8 : 0,5 min ; 3 transferts pour 4 machines (le cahier en compte 4), M4 envoie au contrôle."}
  machine.operators: {status: exemple, note: "Cahier §3.3 : un opérateur par machine."}
  machine.pauses:
    status: calibre
    note: >-
      Cahier : 110 min de marche / 10 min d'arrêt. Remplacé par les pauses du personnel (clock.breaks) qui
      arrêtent toute la ligne au même moment ; run_min = 480 et stop_min = 0 (aucun arrêt propre à la machine).
  machine.outil: {status: calibre, note: "Usure d'outil : tranche 2 (le cahier ne donne aucune durée de vie) ; tool_life absent."}
  machine.protect_buffer: {value: 30, unit: produit, status: calibre, note: "Factory.protect_buffer, action proteger_goulot, mode tampon_avant : table devant le goulot portée de 10 à 30 produits, soit 90 min de travail du goulot, plus qu'une réparation de M1 (1 h) ; prix : 20 produits d'encours en plus (loi de Little)."}

  # --- Qualité (cahier §3.4) -----------------------------------------------------------------------------
  qualite.controle_min_produit:
    value: 0.7
    unit: min par produit
    status: calibre
    note: >-
      Cahier : 1 min, soit 60 / h, autant que 3 lignes au goulot (60 / h) : le contrôle deviendrait le goulot de
      l'usine. 0,7 min donne 60 / 0,7 = 85,7 / h >= 1,2 x 60 = 72 / h (annexe §5). Indicatif.
  qualite.frequence: {value: 1.0, unit: part des produits contrôlés, status: exemple, note: "Cahier §3.4 : 100 % (1 sur N : module qualité, tranche 2)."}
  qualite.facteur_defauts: {status: calibre, note: "difficulties.defect_factor (0,5 ; 1 ; 1,5) appliqué aux taux de défaut du cahier."}
  qualite.seuil_blocage:
    status: source
    source: wikipedia-en-p-chart
    note: >-
      Tranche 2. Limite haute de la carte p = p + 3 x racine(p (1 - p) / n), p = part de défauts attendue,
      n = produits contrôlés du lot ; calculée par la génération dans qc_block_threshold. Avec p = 7,8 % et
      n = 24 : 24 %, soit 6 rebuts ou plus sur 24 (fausse alerte : 0,9 % des lots, loi binomiale). Le seuil fixe
      de 15 % du cahier (4 rebuts sur 24) bloquerait 11 % des lots sans aucune dérive du procédé.

  # --- Emballage (cahier §3.5) ---------------------------------------------------------------------------
  emballage.produits_par_colis:
    value: 4
    unit: produit
    status: calibre
    note: >-
      Cahier : 1, soit 6 produits par palette en 6 x 2 + 5 = 17 min, 21 / h : l'emballage serait le goulot de
      l'usine. Avec 4 : 60 x 4 x 6 / (6 x 2 + 5) = 84,7 / h >= 72 / h (annexe §5) et des palettes de 24.
  emballage.colis_par_palette: {value: 6, unit: colis, status: exemple, note: "Cahier §3.5."}
  emballage.min_par_colis: {value: 2, unit: min, status: exemple, note: "Cahier §3.5 (mettre en carton, fermer, étiqueter, peser)."}
  emballage.filmage_min_palette: {value: 5, unit: min, status: exemple, note: "Cahier §3.5."}

  # --- Entrepôt PF (cahier §4) ---------------------------------------------------------------------------
  entrepot_pf.capacite_palettes: {value: 20, unit: palette, status: exemple, note: "Cahier §4 : 480 produits, environ 2 jours de demande à 2 lignes."}
  entrepot_pf.chargement_min_palette: {value: 2, unit: min par palette, status: exemple, note: "Cahier §4."}
  entrepot_pf.stock_initial_jours: {status: calibre, note: "difficulties.pf_stock_days (1,2 ; 1 ; 0,5 jour de demande), toujours sous les 20 palettes."}

  # --- Client (cahier §4.1) ------------------------------------------------------------------------------
  client.charge:
    status: calibre
    note: >-
      difficulties.load (0,80 ; 0,85 ; 0,92) : demande par jour = charge x débit réel attendu (expected_h) des
      machines de la partie, facteurs de difficulté compris, x lignes actives x 8 h ; la génération vérifie une
      charge réelle < 0,95. Au-delà de 0,9, l'attente croît très vite (wikipedia-en-kingman-s-formula). Expert
      porté à 0,92 au calibrage du 05/11/2026 (232 produits par jour, graine 5). Le cahier (100 / jour) chargeait
      l'usine à 23 %.
  client.variabilite: {value: 0.10, unit: écart relatif, status: exemple, note: "Cahier §4.1 : ± 10 % (équilibré) ; 5 % et 15 % en découverte et expert (difficulties.demand_variability, calibre)."}
  client.delai_promis_jours: {status: calibre, note: "difficulties.promised_days : J+2 (J+1 en expert). Le cahier promet 5 jours, une semaine entière : aucun retard possible."}
  client.orders_per_day: {value: 1, unit: commande, status: calibre, note: "Customer.orders_per_day : une commande par jour ouvré, passée à 8 h, d'environ une journée de demande."}
  client.pickup_window_min: {value: [360, 450], unit: minute depuis 8 h, status: calibre, note: "Customer.pickup_window_min : camion du client entre 14 h et 15 h 30, après les livraisons MP (8 h - 10 h) ; le quai partagé n'est en conflit qu'en cas de retard."}

  # --- Maintenance (cahier §3.6) -------------------------------------------------------------------------
  maintenance.techniciens: {value: 1, unit: technicien, status: exemple, note: "Cahier §3.6 : une seule réparation à la fois."}
  maintenance.trajet_min: {value: 3, unit: min, status: exemple, note: "Cahier §3.6 : déplacement jusqu'à la machine."}
  maintenance.convention_mtbf:
    status: source
    source: wikipedia-en-availability
    note: >-
      MTBF = temps moyen de marche entre deux pannes, réparation exclue (wikipedia-en-mean-time-between-failures,
      wikipedia-fr-temps-moyen-entre-pannes) ; disponibilité intrinsèque = MTBF / (MTBF + MTTR) ; disponibilité
      opérationnelle = MTBF / (MTBF + arrêt moyen), arrêt = attente du technicien + trajet + MTTR. Le MTTR exclut
      les délais logistiques (wikipedia-en-mean-time-to-repair). wikipedia-fr-disponibilite prend l'autre
      convention (MTBF = MTTF + MTTR) : ne pas la mélanger.
  maintenance.preventif_min: {value: 20, unit: min par machine, status: calibre, note: "Graissage, contrôle, pièce d'usure : indicatif. Égal à la pause de 20 min pour qu'un préventif fait pendant cette pause n'arrête pas la production."}
  maintenance.preventif_regle:
    status: calibre
    note: >-
      Une intervention par machine ciblée et par tour, faite pendant les pauses du personnel (les plus longues
      d'abord), goulots d'abord ; la part qui dépasse la pause arrête la machine ; une panne passe avant ; l'âge
      de la machine revient à zéro. Règle détaillée : annexe §5 (29/10).
  maintenance.cout_reparation_h: {value: 75, unit: € par heure de réparation, status: calibre, note: "Technicien et pièces courantes : ordre de grandeur indicatif, non sourcé."}
  maintenance.cout_preventif: {value: 50, unit: € par intervention, status: calibre, note: "Indicatif, non sourcé. Une heure d'arrêt du goulot ne coûte des ventes que si la ligne est saturée : quand le marché limite l'usine, elle se rattrape sur l'attente du goulot (wikipedia-fr-theorie-des-contraintes l.32 ; audit du préventif du 19/11/2026, J04 : 0 produit perdu)."}
  maintenance.cout_degats_panne:
    value: 200
    unit: € par panne
    status: calibre
    note: >-
      Pièces cassées et dégâts en chaîne d'une panne, en plus de la réparation (factory.costs.damage_per_failure, P3 de
      docs/audits/preventif-2026-11-19.md). Principe sourcé : le correctif coûte plus que le préventif à cause des
      dégâts consécutifs (wikipedia-en-maintenance l.50) ; montant : choix de calibrage, non sourcé, indicatif. Mesure
      du 21/11/2026 (J04, 3 lignes, sans aléas, graines 5 à 8 ; préventif du goulot contre aucun ; Δ trésorerie
      moyen) : forme 2 au MTBF du jeu +262 € (-425 à +1 225, neutre au bruit près) ; forme 2 au MTBF x 0,4 +451 € ;
      forme 3 +265 € ; forme 1 -3 038 € (le préventif n'évite rien). 0 € : -1 238 € même en usure ; 150 € : -112 € à
      x 1 mais -137 € à x 0,4 (le préventif ne paie jamais) : 200 retenu.

  # --- Pilotage (cahier §3.7) ----------------------------------------------------------------------------
  pilotage.journee_min: {value: 480, unit: min, status: exemple, note: "Cahier §3.7 : journée de 8 h simulées."}
  pilotage.jours_par_tour: {value: 5, unit: jour, status: calibre, note: "Décision de l'utilisateur du 28/10/2026 : un tour = une semaine de 5 jours rejouée."}
  pilotage.pauses:
    value: [[120, 10], [240, 20], [360, 10]]
    unit: minute depuis 8 h, durée en minutes
    status: calibre
    note: >-
      2 x 10 + 1 x 20 min (40 min sur 480, comme les 4 x 10 du cahier : disponibilité 440 / 480 = 91,7 %). La pause
      de 20 min consécutives dès 6 h de travail quotidien est le minimum du Code du travail, art. L3121-16 (texte
      lu sur des reprises secondaires, Légifrance à vérifier ; hors corpus) ; les deux pauses de 10 min sont un
      usage d'entreprise.
  pilotage.chefs_de_ligne: {value: 1, unit: personne, status: exemple, note: "Cahier §3.3 : un chef de ligne pour toutes les lignes."}
  pilotage.releve_pauses: {status: calibre, note: "Mode releve_pauses : le chef de ligne fait tourner le goulot pendant les pauses ; seul, il ne relève qu'une ligne à la fois (une autre demande est refusée). Gain : 40 min de goulot par jour, environ +9 % ; coût : minutes de relève x pilotage.cout_operateur_h. Règle détaillée : annexe §5 (29/10)."}
  pilotage.taille_lot:
    value: 24
    unit: produits lancés
    status: calibre
    note: >-
      Cahier : 20. 24 = une palette de 24 (4 colis x 6) : les lots font des palettes entières, la palettisation
      continue d'un lot à l'autre. Avec 0 min de réglage au goulot, la taille du lot ne coûte rien au débit.
  pilotage.lancement_avec_rebut:
    status: calibre
    note: >-
      Pilote automatique : lots à lancer = besoin en bons / (24 x rendement cumulé attendu), arrondi au-dessus.
      Le « x (1 + taux de rebut) » du cahier sous-estime le surplus : écart faible à 7,8 % de rebut (1,078 contre
      1,084), net à 20 % (1,20 contre 1,25).
  pilotage.pf_min_jours: {value: 1, unit: jour de demande, status: calibre, note: "pf_min : le pilote automatique lance un OF quand stock PF + encours < une journée de demande."}
  pilotage.pf_max_jours: {value: 3, unit: jour de demande, status: calibre, note: "Lancement par campagne : sous pf_min, le pilote lance jusqu'à pf_max = 3 jours de demande, borné par le magasin PF, au lieu d'un jour ; évite de vider et redémarrer la ligne chaque jour. Mesure du 05/11/2026 (graines 5 à 8, équilibré) : 3 jours = plafond du magasin PF (4 ou 5 jours ne changent rien), TRS 77,0-78,0 % ; 2 jours donne 77,5-79,1 % mais une rupture en découverte (graine 7) et 73,8 % en expert : 3 gardé. Indicatif, non sourcé."}
  pilotage.temps_de_lot:
    status: exemple
    note: >-
      Cahier §8 : temps d'un lot de n = premier produit + (n - 1) x cycle du goulot, sans attente ; premier produit
      = somme des cycles + 3 transferts = 9 min. Formule du cahier sans fiche : montrée au débrief comme exemple.
  pilotage.trs:
    status: source
    source: wikipedia-fr-taux-de-rendement-synthetique
    note: >-
      TRS = disponibilité x performance x qualité sur le temps planifié : jours ouvrés d'une ligne qui a un OF ; le
      temps sans OF (sous-charge) n'est pas planifié, comme le distingue la fiche (OEE et OOE). Depuis b6f1cf8
      (décision de l'orchestrateur), le moteur retire aussi les pauses du temps planifié (factory_game._snapshot).
      C'est une convention, pas une règle : wikipedia-fr-taux-de-rendement-synthetique l.48 dit qu'une pause
      réglementaire est, « selon les organisations », un arrêt ou une réduction du temps d'ouverture (l.11 : « standard
      propre à chaque organisation ») ; l'exemple de la fiche OEE anglaise (l.66-71) suit l'autre convention (pause de
      30 min comptée en perte, 390 / 480). NF E60-182 : non lue (à vérifier). Différent du taux de réalisation du plan =
      bons réalisés / bons prévus par les OF (lines[].production_rate).
  pilotage.objectif_otif: {value: 95, unit: "%", status: calibre, note: "Repris de l'atelier ; OTIF commande par commande (wikipedia-en-supply-chain-operations-reference)."}
  pilotage.objectif_trs:
    value: 80
    unit: "%"
    status: calibre
    note: >-
      80 % depuis le 19/11/2026 (choix de calibrage, non sourcé) : le TRS exclut désormais les pauses, le pilote
      mesure 82,7-92,0 % à une ligne et 79,5-82,3 % à trois lignes (graines 5 à 8, partie de référence et jeux
      J01 à J10) ; 80 est atteint partout sauf l'équilibré à trois lignes (partiel, 79,5-80,5 %), le passif est à
      0 %. Une cible unique reste plus basse que le TRS à une ligne : la sous-charge des trois lignes (charge
      répartie, magasin PF borné) baisse le TRS sans faute du joueur. Les attentes de matière comptent comme pertes
      de disponibilité sur le temps planifié (machine « No Input », wikipedia-en-overall-equipment-effectiveness).
  pilotage.tresorerie_initiale_semaines: {status: calibre, note: "difficulties.cash_weeks (6, 4, 3 semaines d'achats de MP), comme l'atelier. Expert porté de 2,5 à 3 le 19/11/2026 : à une ligne (J02, graine 5), le pilote, qui n'achète que dans la limite de sa trésorerie, ne pouvait plus recommander en semaine 2 (2 jours-ligne sans matière) ; mesure : docs/audits/preventif-2026-11-19.md § 5."}
  pilotage.taux_possession_semaine: {value: 0.0048, unit: part de la valeur du stock par semaine, status: calibre, note: "25 % par an, ordre de grandeur usuel du coût de possession, repris de l'atelier ; indicatif, non sourcé."}
  pilotage.taux_interet_semaine: {value: 0.004, unit: part du solde négatif par semaine, status: calibre, note: "Agios repris de l'atelier ; indicatif."}
  pilotage.cout_operateur_h: {value: 28, unit: € par heure, status: calibre, note: "Coût employeur d'un opérateur, ordre de grandeur indicatif (à vérifier : INSEE, coût horaire de la main-d'œuvre) ; sert aux heures de relève."}
  pilotage.prix_et_couts: {status: calibre, note: "Prix de vente, coût de transformation (main-d'œuvre comprise, environ 4 opérateurs x 3 min = 0,2 h par produit) et coût de la MP des themes : ordres de grandeur indicatifs, non sourcés."}
  pilotage.effets_aleas: {status: calibre, note: "Ampleur des effets des aléas (events) : indicative, non sourcée."}
  interface.seuils_attention: {status: calibre, note: "panels[].columns[].warn : OTIF 90 pour 95 (5 points sous la cible, écart de l'exemple de l'annexe 0008 §2) ; TRS 73 pour 80 depuis le 19/11/2026 (7 points : seuil d'une semaine, sous la zone partielle 75-80 de la moyenne, voir l'alerte trs_low). Marge de 5 points de criteria = bas de la zone partielle ; n'entre dans aucun calcul de la simulation."}

  # --- Réseau logistique (ADR 0009, section `network`) ----------------------------------------------------
  # Délai de transport = préparation + arrondi au-dessus (km / vitesse / heures de conduite par jour), borné 1 à 8 :
  # dérivation du jeu, pas une citation. Classes par défaut : rapide 0 + 1 = 1 j, standard 2 + 1 = 3 j, économique
  # 3 + 2 = 5 j, soit les délais de fournisseur.profils.
  reseau.conduite_h_jour:
    value: 9
    unit: heure de conduite par jour
    status: source
    source: reglement-ce-561-2006-temps-de-conduite
    note: >-
      Règlement (CE) n° 561/2006, art. 6 § 1 : conduite journalière de 9 h au plus (10 h au plus deux fois par
      semaine) ; art. 6 § 2 : 56 h par semaine ; art. 7 : pause d'au moins 45 min après 4 h 30 de conduite. Texte lu
      dans la reproduction de l'OPPBTP (mise à jour du 1er juin 2022), EUR-Lex non ouvert : à vérifier avant
      publication. Le passage des kilomètres aux jours est une dérivation du jeu.
  reseau.vitesse.route: {value: 70, unit: km/h moyens, status: calibre, note: "Vitesse moyenne d'un camion porteur sur la journée de conduite (autoroute, nationale, traversées) : ordre de grandeur indicatif. Le règlement 561/2006 ne donne aucune vitesse ; limites du Code de la route pour les poids lourds : à vérifier."}
  reseau.distance.proche: {value: 250, unit: km, status: calibre, note: "Fournisseur de la région ou d'une région voisine : 250 / 70 = 3,6 h de conduite, 1 jour. Indicatif."}
  reseau.distance.national: {value: 800, unit: km, status: calibre, note: "Autre bout du pays : 800 / 70 = 11,4 h, au-delà des 9 h de l'art. 6 du règlement 561/2006, donc 2 jours. Indicatif."}
  reseau.distance.import: {value: 1300, unit: km, status: calibre, note: "Pays voisin d'Europe : 1 300 / 70 = 18,6 h, 3 jours à 9 h par jour. Indicatif."}
  reseau.preparation.fournisseur_rapide: {value: 0, unit: jour, status: calibre, note: "Expédition le jour de la commande : avec la classe proche, 0 + 1 = 1 jour, délai du profil rapide."}
  reseau.preparation.fournisseur_standard: {value: 2, unit: jour, status: calibre, note: "Préparation et chargement : avec la classe proche, seule permise, 2 + 1 = 3 jours, délai du fournisseur du cahier (exemple). Classe national (4 jours) retirée le 21/11/2026 : voir network.sites.fournisseur_standard."}
  reseau.preparation.fournisseur_economique: {value: 3, unit: jour, status: calibre, note: "Commandes groupées par 4 palettes : avec la classe national, 3 + 2 = 5 jours, délai du profil économique. Classe import : 6 jours."}
  reseau.preparation.client: {value: 0, unit: jour, status: calibre, note: "Le client enlève lui-même (client.pickup_window_min) : la distance du client ne change aucun calcul du moteur, elle place seulement son site sur la carte."}

  # --- Variété de l'usine (ADR 0013, T4 ; annexe 0013 §1 et §3). Règles de jeu, non sourcées ; aucun nombre nouveau
  # n'entre dans la simulation : fournisseurs, clients et types de machine reprennent les valeurs ci-dessus. -----------
  limites.produits:
    status: calibre
    note: >-
      limits.products [1, 3, 1], règle de jeu, non sourcée. Défaut 1 = jeu de référence. Maximum 3 et non 4 (annexe 0013
      §1) : chaque produit a au moins sa ligne (Line.product_id, annexe §3) et la zone production tient 3 lignes au plus
      (block_types.ligne, params.lines). Produits pris dans themes.<secteur>.products (4 par secteur). Aujourd'hui
      [1, 1, 1] : le moteur ne joue qu'un produit (sinon erreur 500) ; la cible [1, 3, 1] revient avec la tranche T4b
      (annexe 0013 § 3 bis).
  limites.fournisseurs:
    status: calibre
    note: >-
      limits.suppliers [3, 8, 3], règle de jeu, non sourcée. 3 = un fournisseur par profil (rapide, standard,
      économique), le moins pour garder l'arbitrage coût, délai, fiabilité ; défaut = jeu de référence. Au-delà : les
      fournisseurs de themes.<secteur>.extra_suppliers dans l'ordre (fournisseur.supplementaires) ; 8 = plafond de
      GameParams.suppliers.
  limites.clients:
    status: calibre
    note: >-
      limits.clients [1, 4, 1], règle de jeu, non sourcée. 1 = jeu de référence (themes.<secteur>.client) ; au-delà,
      themes.<secteur>.extra_clients dans l'ordre (client.supplementaires) ; 4 = plafond de Factory.clients. Aujourd'hui
      [1, 1, 1] : le moteur ne joue qu'un client (sinon erreur 500) ; la cible [1, 4, 1] revient avec la tranche T4b
      (annexe 0013 § 3 bis).
  fournisseur.supplementaires:
    status: calibre
    note: >-
      Règle de jeu, non sourcée. Les 3 premiers fournisseurs sont ceux du produit de référence (mp.suppliers, un par
      profil). Un fournisseur ajouté (themes.<secteur>.extra_suppliers) prend les nombres de son profil
      (fournisseur.profils, ecart_fiabilite compris) et le site de ce profil (network.sites.fournisseur_<profil>, sa
      distance par défaut) : aucun délai, prix ni fiabilité nouveau. Chaque fournisseur retenu offre la MP de chaque
      produit de la partie (négociant ou centre de service de l'acier, plausible pour tubes, tôles et plats ; indicatif).
      Le pilote commande toujours au premier fournisseur standard : le calibrage des ruptures (D9) reste valable. Un
      fournisseur ajouté ne crée pas d'arbitrage nouveau (même profil) : il varie le réseau et la carte. Villes :
      décor, aucune distance réelle n'est calculée.
  client.supplementaires:
    status: calibre
    note: >-
      Règle de jeu, non sourcée. Client k (1 à 4) achète le produit k modulo le nombre de produits (chaque produit a
      au moins un client : il faut clients >= produits) ; la demande d'un produit (client.charge) est partagée à parts
      égales entre ses clients, une commande par client et par jour (client.orders_per_day), même fenêtre
      d'enlèvement (client.pickup_window_min), site cloné de network.sites.client (proche). Aucun nombre nouveau.
  machine.types_par_operation:
    status: calibre
    note: >-
      Règle de jeu, non sourcée : machine_types.<type>.ranks = rangs d'opération (1 à 4) où ce type peut servir ; le
      type écrit dans themes.*.products[].operations reste le défaut (jeu de référence). Types et nombres = les 4
      machines de l'exemple du cahier (machine.*, exemple). m3 seul au rang 3 et seul à 3 min : le goulot reste au
      rang 3, à 20 / h et sans réglage, donc les calibrages qui en dépendent tiennent (postes hors lignes >= 1,2 x
      3 lignes, lot de 24 sans coût de débit, difficulties.bottleneck_shape). transfer_min dépend du rang, pas du
      type : 0,5 min, sauf le dernier rang, 0 (machine.transfer_min). Jouabilité des types hors défaut à mesurer au
      pilote avant tirage (moteur-jeu).
  monde.agrandissement_hall_m:
    value: [0, 4, 8, 12]
    unit: m ajoutés à la largeur et à la profondeur du hall
    status: calibre
    note: >-
      Règle de jeu, non sourcée (placeur à graine, layout.HALL_GROWTH_M) : le hall de 48 x 30 m grandit d'une de ces
      valeurs par côté, départements en place ; seules les allées s'élargissent (règles aisle_min respectées, ce sont
      des minimums). Aucun calcul du moteur ne dépend de la taille du hall avant les trajets calculés (T5).

  # --- Campus et trajets (ADR 0013, T5 ; annexe 0013 §2 et §3). Lus seulement quand le plan compte 2 bâtiments ou
  # plus ; à 1 bâtiment, kit_min et maintenance.trajet_min restent fixes (jeu de référence). ---------------------------
  limites.batiments:
    status: calibre
    note: >-
      limits.buildings [1, 3, 1], règle de jeu, non sourcée (annexe 0013 §1). 1 = hall en U du jeu de référence
      (place_world, template usine). 2 ou 3 = hall_production plus entrepot et/ou atelier_maintenance (campus) ; 3 =
      nombre d'archétypes dont le moteur chronomètre la liaison (kit, transfert PF, technicien), voir campus.
      Ouvert aux formateurs le 27/11/2026 (étape 9 du plan T5, annexe 0013 §2 bis), après place_campus et le compte
      de walls et door par required_assets.
  campus.cellule_m:
    value: 4
    unit: m
    status: calibre
    note: >-
      Règle de jeu : pas de la grille du campus, multiple de grid.site_cell_m (0,5). L'allée d'une cellule entre deux
      bâtiments (layout.check_placement) fait 4 m, au-dessus des 3,70 m d'une allée à double sens pour deux chariots
      veh_forklift (2 x 1,15 m + 1,40 m : INRS ED 949, § 2.2.2, et ED 6350, annexe 3, fiche
      inrs-allees-chariots-et-pietons) ; le passage piéton séparé (0,80 m) n'y est pas garanti, à vérifier avant d'y
      voir un plan réel.
  campus.tailles_batiments:
    status: calibre
    note: >-
      building_archetypes.*.size_cells, règle de jeu, indicatif. Hall : 9 x 6 cellules (36 x 24 m) logent la production
      à 3 lignes (22 x 11,5 m), contrôle et emballage (10 m de large) et les allées de 2,5 m ; le minimum est porté à
      10 x 6 (40 x 24 m) le 27/11/2026 : à 36 m, l'entrée (milieu de façade) tombe devant le bureau du pilotage, et le
      chemin des chariots production -> entrepot_pf passe à 1,3 m du poste (règle postes_proteges_chariots, INRS
      ED 6350, § 4.4) ; à 40 m, il passe à plus de 1,5 m dans la disposition de référence ; s'il loge aussi la
      logistique, 12 x 8 (48 x 32 m) au moins, l'emprise du hall en U ; 15 x 11 couvre son agrandissement maximal
      (60 x 42 m, monde.agrandissement_hall_m). Entrepôt : 9 x 6 cellules pour réception (15,5 x 9 m), quai
      (12 x 6,5 m), racks MP (10 x 18 m) et PF (15,5 x 9,5 m) du hall en U, soit 545 m² hors allées. Maintenance :
      3 x 2 cellules (12 x 8 m) pour l'établi et le tableau (10 x 3,5 m dans le hall en U).
  trajet.marche_m_min:
    value: 75
    unit: m par minute (1,25 m/s)
    status: calibre
    note: >-
      Logistics.walk_m_per_min : technicien à pied (maintenance -> production). Fiche bohannon-vitesse-de-marche
      (Bohannon R. W., Age and Ageing 26(1), 1997, p. 15-19, résumé seul lu) : vitesse confortable moyenne de
      1,27 m/s (femmes de 70 ans) à 1,46 m/s (hommes de 40 ans), soit 76 à 88 m/min (conversion). 75 m/min, un peu
      sous le bas de cette plage : choix prudent du jeu (marche d'atelier avec virages, portes et arrêts aux
      croisements de chariots), non chiffre de la source. Indicatif.
  trajet.chariot_m_min:
    value: 100
    unit: m par minute (6 km/h moyens)
    status: calibre
    note: >-
      Logistics.forklift_m_per_min : chariot élévateur (kits, palettes PF), vitesse moyenne d'un trajet, démarrage et
      freinage compris. Règle de jeu, non sourcée : aucune source lue ne chiffre une vitesse de chariot. Fiche
      circulation-vitesse-chariots-interieur : Code du travail, art. R4323-51 (texte lu sur code.travail.gouv.fr,
      Légifrance à vérifier), l'employeur « établit des règles de circulation adéquates » ; INRS ED 766 (4e éd.,
      2019, p. 22, hors corpus) demande de ralentir à l'approche des piétons, sans chiffre. Indicatif, une seule
      vitesse dedans et dehors (l'annexe 0013 §3 n'en prévoit qu'une).
  trajet.formules:
    status: calibre
    note: >-
      Règle de jeu (annexe 0013 §2 bis, décision 3 ; layout.travel_min, en campus seulement). t = travel_min(a, b,
      mode) = path_m(a, b) ÷ vitesse du mode ; path_m part du centre de l'aire du département et passe par les portes
      des pièces et les entrées des bâtiments. Kit (t = stock_mp -> production, chariot) : kit remis à la ligne à
      8 + t, chariot occupé 8 + 2t (aller chargé, retour à vide) ; stock_mp.kit_min (8 min) ne compte plus que la
      préparation. Technicien (t = maintenance -> production, à pied) : aller seul, remplace maintenance.trajet_min.
      Exemple : racks à 40 m de la production, t = 0,4 min, kit remis à 8,4 min, chariot libre à 8,8 min ; atelier
      de maintenance à 60 m, 60 / 75 = 0,8 min (3 min fixes dans le hall en U).
  trajet.manutention_palette_min:
    value: 1
    unit: min par palette (prise et dépose)
    status: calibre
    note: >-
      Logistics.pallet_handling_min (annexe 0013 §2 bis, décision 2 ; condition de l'archétype entrepot), en campus
      seulement : chaque palette filmée va de l'emballage à l'entrepôt PF par le chariot (partagé avec les kits, une
      palette en attente servie avant les kits). Avec t = travel_min(emballage, entrepot_pf, chariot) : palette
      livrée au PF à 1 + t, chariot libre à 1 + 2t après la prise (1 min de prise et dépose, indicatif, non sourcé).
      Prise seulement si une place PF est libre en comptant les palettes en route (place réservée à la prise) ;
      l'emballage attend la prise, le stock PF augmente à l'arrivée. Exemple : 35 m, t = 0,35 min, palette livrée à
      1,35 min, chariot libre à 1,7 min ; à 3 lignes, jusqu'à 17 palettes par jour, soit 29 min de chariot en plus
      des 18 kits (environ 160 min) : le chariot reste sous les 480 min de la journée.
  zonage.marche_max_maintenance_m:
    value: 150
    unit: m de marche
    status: calibre
    note: >-
      Règle de jeu, non sourcée (zoning_rules max_walk_m, layout.path_m) : chemin à pied du centre de la maintenance
      au centre de la production (pas à chaque machine) d'au plus 150 m, soit 2 min à trajet.marche_m_min (75 m/min), sous les 3 min du cahier (maintenance.trajet_min) :
      un campus n'allonge pas l'arrêt d'une panne au-delà du jeu de référence. Le trajet reste petit devant le MTTR
      (30 à 60 min) : la leçon vraie est que la distance pèse surtout sur les kits du chariot, peu sur les pannes.

