# Départements (cahier §1 et image « Chaque département a ses agents ») : 8 dans l'usine, 2 externes, plus le quai
# partagé, zone sans agent ni poste (annexe §5, 29/10). area = x_min, z_min, x_max, z_max (m).
# Un agent parlant par département du cahier ; `facts` = clé de engine._FACTS (à
# écrire par moteur-jeu, étape 6) ; le commentaire « dit » liste les faits attendus, tous calculés par le moteur
# (aucun chiffre inventé), une ou deux phrases chacun. Le placeur pose les éléments selon le `block` du
# département (bord, rayonnages, ligne, site), leur `role` et `front` ; une zone externe déclare `site` au lieu
# de `area`. Il trace la zone (prop_floor_zone, ref dept:<id>) et place les lignes dans `production`. `ref: mp`
# désigne mp:<id de la MP> (un seul article en tranche 1).
departments:
  - id: fournisseur
    label: Fournisseur de matière première
    external: true
    block: site
    site: fournisseur_standard   # agent parlant du fournisseur standard ; les sites rapide et économique n'en ont pas
    stations: []
    elements:   # le bâtiment est celui du site (network.sites.*.building)
      - {asset: prop_pallet_stack, label: Palettes prêtes, role: decor, count: 2}
    agent:
      name: Paul
      job: Commercial du fournisseur
      character: char_manager_m
      facts: usine_fournisseur
      # dit : commandes en cours (palettes, jour de livraison prévu, créneau 8 h - 10 h) ; retard annoncé d'une
      # livraison (urgent) ; hausse de prix en cours ; réclamation reçue pour une palette non conforme.
      tasks: [recevoir les commandes de l'usine, préparer les palettes, envoyer le camion avec le bon de livraison]
      notions: [delai_et_fiabilite]
  - id: reception
    label: Réception
    area: [-24, 6, -8.5, 15]
    block: bord
    front: nord
    stations: [{kind: poste_reception, label: Poste de contrôle de la réception}]
    elements:
      - {asset: prop_floor_zone, label: Zone de dépose (6 palettes), role: tampon}
      - {asset: prop_floor_zone, label: Quarantaine (2 palettes), ref: quarantine, role: stockage}
      - {asset: prop_desk_computer, label: "Poste de contrôle : PC, lecteur, imprimante d'étiquettes", role: poste}
      - {asset: veh_pallet_jack, label: Transpalette (2 000 kg), role: engin}
    agent:
      name: Noah
      job: Réceptionnaire
      character: char_worker_m
      facts: usine_reception
      # dit : palettes reçues au dernier tour et mises en quarantaine (urgent si > 0) ; attente d'un camion au quai
      # (minutes) ; prochaine livraison attendue (jour, palettes).
      tasks: [décharger les camions, contrôler et étiqueter les palettes, mettre les non-conformes en quarantaine et prévenir le pilotage]
      notions: [delai_et_fiabilite]
  - id: stock_mp
    label: Stock de matière première
    area: [-24, -15, -14, 3]
    block: racks
    front: est
    capacity: mp_capacity_pallets   # ⌈24 / 6⌉ = 4 racks
    stations: [{kind: magasin_mp, label: Bureau du magasin MP}]
    elements:
      # 6 places par rack : 2 travées de 3 palettes Europe, un niveau montré ; indicatif (calibre)
      - {asset: prop_pallet_rack, label: Racks à palettes (24 emplacements), ref: mp, role: stockage, per: places, places: 6}
      - {asset: prop_floor_zone, label: Préparation des kits, role: tampon}
      - {asset: veh_forklift, label: Chariot élévateur (1 200 kg), role: engin}
    agent:
      name: Inès
      job: Magasinière-cariste
      character: char_worker_f
      facts: usine_stock_mp
      # dit : stock MP en palettes et places libres ; sous le point de commande, commandes en cours comprises
      # (urgent) ; kits livrés et minutes de ligne arrêtée faute de matière au dernier tour (urgent si > 0).
      tasks: [ranger les palettes reçues, sortir la matière dans l'ordre d'arrivée, préparer et livrer le kit de chaque OF, signaler le stock sous le point de commande]
      notions: [point_de_commande, stock_de_securite, rotation_fifo]
  - id: production
    label: Production
    area: [-11, -8.5, 11, 3]
    block: ligne
    front: sud
    stations: [{kind: tableau_ligne, label: Tableau de ligne}]   # postes `machine` : un par machine, créés par la génération
    elements:
      - {asset: prop_machine, label: Machine, role: machine, per: machine}
      - {asset: prop_buffer_table, label: Table d'attente (10 produits), role: tampon, per: machine}
      - {asset: prop_wall_board, label: "Tableau de ligne : OF en cours, cadence, arrêts", role: affichage}
      - {asset: prop_andon_light, label: Andon de la ligne, role: affichage, per: line}
    agent:
      name: Idriss
      job: Chef de ligne
      character: char_worker_m
      module: production
      facts: usine_production
      # dit : par ligne, bons par heure mesurés et attendus ; machine goulot et ses minutes perdues (panne, attente
      # matière, sortie pleine, pause) au dernier tour (urgent si le goulot a perdu du temps) ; OF en cours.
      tasks: [lancer les OF sur les lignes, suivre la cadence et les arrêts, relayer l'opérateur du goulot pendant les pauses, appeler la maintenance]
      notions: [goulot, tampon_avant_goulot, rendement_en_cascade, changement_de_serie]
  - id: qualite
    label: Contrôle qualité
    area: [14, -15, 24, -4.5]
    block: bord
    front: ouest
    stations: [{kind: poste_qualite, label: Table de contrôle}]
    elements:
      - {asset: prop_inspection_table, label: Table de contrôle et instruments, ref: quality, role: poste}
      - {asset: prop_floor_zone, label: Zone conforme, role: tampon}
      - {asset: prop_floor_zone, label: Zone à retoucher, role: tampon}
      - {asset: prop_scrap_bin, label: Bac à rebut, ref: scrap, role: stockage}
    agent:
      name: Léa
      job: Contrôleuse qualité
      character: char_worker_f
      facts: usine_qualite
      # dit : produits contrôlés et rebutés au dernier tour, part de bons mesurée et attendue (rendement cumulé ;
      # urgent si mesurée < attendue de plus de 2 points) ; produits en attente de contrôle.
      tasks: [contrôler chaque produit en sortie de ligne, trier conformes et rebuts, prévenir le chef de ligne quand le rebut grimpe]
      notions: [rendement_en_cascade, carte_p]
  - id: emballage
    label: Emballage
    area: [14, -2, 24, 3]   # 10 x 5 m : table, filmeuse et palette tiennent ; 2 m rendus à l'entrepôt PF
    block: bord
    front: ouest
    stations: [{kind: poste_emballage, label: Table d'emballage}]
    elements:
      - {asset: prop_packing_table, label: "Table d'emballage : cartons, ruban, balance", role: poste}
      - {asset: prop_pallet_wrapper, label: Filmeuse de palettes, role: machine}
      - {asset: prop_pallet, label: Palette en cours, role: tampon}
    agent:
      name: Malik
      job: Emballeur
      character: char_worker_m
      facts: usine_emballage
      # dit : colis et palettes faits au dernier tour ; produits conformes en attente d'emballage (urgent au-delà de
      # 2 palettes).
      tasks: [mettre 4 produits par carton, étiqueter et peser, monter et filmer les palettes, les envoyer à l'entrepôt]
      notions: [loi_de_little]
  - id: maintenance
    label: Maintenance et pièces de rechange
    area: [-11, -15, -1, -11.5]
    block: bord
    front: sud
    stations: [{kind: maintenance, label: Établi de maintenance}]
    elements:
      - {asset: prop_workbench, label: Établi et servante d'outils, role: poste}
      - {asset: prop_wall_board, label: Tableau des interventions, role: affichage}
    agent:
      name: Karim
      job: Technicien de maintenance
      character: char_worker_m
      module: maintenance
      facts: usine_maintenance
      # dit : pannes et minutes d'arrêt au dernier tour, machine la plus touchée (urgent si c'est un goulot) ;
      # disponibilité mesurée du goulot de chaque ligne ; pannes qui ont attendu le technicien (nombre, minutes) ;
      # préventifs faits.
      tasks: [aller réparer les machines en panne, faire le préventif pendant les pauses, tenir le tableau des interventions]
      notions: [disponibilite, pannes_par_usure, maintenance_preventive]
  - id: pilotage
    label: Pilotage
    area: [1.5, -15, 11, -11]   # 1,3 m de bureau + 2,5 m de bande d'allée ; reste 2,5 m jusqu'à la production
    block: bord
    front: sud
    stations: [{kind: pilotage, label: Bureau du pilotage}]
    elements:
      - {asset: prop_desk_computer, label: "Bureau : stocks, OF, commandes", role: poste}
      - {asset: prop_kpi_screen, label: Écran des indicateurs, ref: kpi, role: affichage}
    agent:
      name: Sophie
      job: Responsable de production
      character: char_manager_f
      module: pilotage
      facts: usine_pilotage
      # dit : commandes client ouvertes et en retard (urgent si en retard) ; stock PF + encours sous le minimum
      # (urgent) ; OTIF et TRS du dernier tour face aux objectifs.
      tasks: [recevoir les commandes client, créer et lancer les OF, commander la matière, suivre les indicateurs]
      notions: [point_de_commande, takt_time, loi_de_little, otif]
  - id: quai
    label: Quai partagé (réception et expédition)
    area: [-6, 8.5, 6, 15]
    block: bord
    front: nord   # allée côté hall ; la porte est sur le mur du fond (z = 15)
    stations: []
    elements:
      # posée sur le mur avant (z = 15), centrée sur la zone ; Godot ouvre le mur à son emprise
      - {asset: prop_dock_door, label: Porte de quai, ref: dock, role: porte}
      - {asset: veh_pallet_jack, label: Transpalette du quai, role: engin}
  - id: entrepot_pf
    label: Entrepôt de produits finis
    # 15,5 x 9,5 m (calibre, indicatif) : 4 racks de 5,5 x 1,5 m en 2 rangées + allée de 2,5 m, puis la zone de
    # préparation (4 x 3 m, environ 10 palettes Europe au sol, le chargement d'un camion client) ; 2,5 m d'allée
    # gardés avec l'emballage (z = 3) et la production (z = 3), règle allees_chariot.
    area: [8.5, 5.5, 24, 15]
    block: racks
    front: ouest
    # ⌈20 / 6⌉ = 4 racks ; `ref: pf` partagée : un seul stock PF (state.factory.pf.units), tous les racks le montrent
    capacity: pf_capacity_pallets
    stations: [{kind: entrepot_pf, label: Bureau de l'entrepôt}]
    elements:
      - {asset: prop_pallet_rack, label: Racks PF (20 palettes), ref: pf, role: stockage, per: places, places: 6}
      - {asset: prop_floor_zone, label: Préparation des commandes, role: tampon}
    agent:
      name: Maya
      job: Magasinière PF
      character: char_worker_f
      facts: usine_entrepot_pf
      # dit : stock PF en palettes et places libres (urgent si plein) ; commande prête ou non pour le prochain
      # camion ; commandes parties en retard ou incomplètes au dernier tour (urgent si > 0).
      tasks: [ranger les palettes venant de l'emballage, préparer les commandes, charger le camion du client, signaler le stock PF sous le minimum]
      notions: [otif]
  - id: client
    label: Client
    external: true
    block: site
    site: client
    stations: []
    elements: []   # le bâtiment est celui du site (network.sites.client.building)
    agent:
      name: Mme Durand
      job: Acheteuse du client
      character: char_manager_f
      facts: usine_client
      # dit : commande du jour (produits, jour promis) ; OTIF du dernier tour (urgent sous l'objectif) ; commandes
      # reçues en retard.
      tasks: [passer les commandes, suivre les livraisons à la date promise, se plaindre des retards]
      notions: [otif]

# Figurants : état animé (disponible, occupé, en déplacement, en pause, absent), aucun dialogue.
crew:
  - {job: operateur, per: machine, characters: [char_worker_m, char_worker_f]}
  - {job: chauffeur_fournisseur, department: fournisseur, characters: [char_driver_m]}
  - {job: chauffeur_client, department: client, characters: [char_driver_m]}

# Modules (format de ai/simulation.yaml ; l'agent du module est celui de son département, `agent.module`).
modules:
  pilotage:
    title: Pilotage
    description: Lancer les ordres de fabrication et acheter la matière pour livrer chaque commande à la date promise.
    role: {id: responsable_production, title: Responsable de production, mission: Livrer les commandes à l'heure sans rupture de matière ni stock inutile}
    stations: [pilotage]
    actions:
      - id: lancer_of
        label: Lancer des ordres de fabrication
        fields:
          - {id: line, label: Ligne, type: choice, source: lines}
          # 40 lots de 24 = 960 > environ 700 produits par ligne et par semaine : un lancement peut charger la ligne
          - {id: lots, label: Nombre de lots de 24, type: int, min: 1, max: 40, step: 1, default: 5}
      - id: commander_mp
        label: Commander la matière première
        fields:
          - {id: offer, label: Matière et fournisseur, type: choice, source: offers}
          - {id: pallets, label: Palettes (un camion), type: int, min: 1, max: 6, step: 1, default: 4}
    autopilot: OF quand stock PF + encours passe sous une journée de demande ; MP au point de commande (consommation pendant le délai + 1 jour), fournisseur standard
    notions: [point_de_commande, stock_de_securite, delai_et_fiabilite, otif, loi_de_little, takt_time, charge_et_attente]
  production:
    title: Production
    description: Protéger le goulot de chaque ligne pour que pauses et pannes en amont ne lui fassent pas perdre de temps.
    role: {id: chef_de_ligne, title: Chef·fe de ligne, mission: Faire tourner le goulot de chaque ligne le plus longtemps possible}
    stations: [tableau_ligne, machine]
    actions:
      - id: proteger_goulot
        label: Protéger le goulot d'une ligne
        fields:
          - {id: line, label: Ligne, type: choice, source: lines}
          - id: mode
            label: Protection
            type: choice
            options:
              - {id: aucune, label: "Aucune : le goulot s'arrête aux pauses et quand l'amont s'arrête"}
              - {id: releve_pauses, label: "Relève : le chef de ligne fait tourner le goulot pendant les pauses (une seule ligne à la fois)"}
              - {id: tampon_avant, label: "Tampon : table de 30 produits devant le goulot, plus d'encours"}
    autopilot: aucune protection
    notions: [goulot, tampon_avant_goulot, rendement_en_cascade, capacite_et_trs, changement_de_serie]
  maintenance:
    title: Maintenance
    description: Choisir où faire le préventif et dans quel ordre réparer, avec un seul technicien.
    role: {id: responsable_maintenance, title: Responsable maintenance, mission: Garder les goulots disponibles au juste coût}
    stations: [maintenance, machine]
    actions:
      - id: preventif
        label: Programmer le préventif d'une ligne
        fields:
          - {id: line, label: Ligne, type: choice, source: lines}
          - id: cible
            label: Machines entretenues chaque semaine
            type: choice
            options:
              - {id: aucune, label: "Aucune : pas de coût, l'usure s'accumule"}
              - {id: goulot, label: "Le goulot : une intervention pendant une pause"}
              - {id: toutes, label: "Toutes les machines de la ligne : plus de coût et de temps de technicien"}
      - id: priorite_reparation
        label: Régler l'ordre des réparations
        fields:
          - id: ordre
            label: Ordre
            type: choice
            options:
              - {id: arrivee, label: Dans l'ordre d'arrivée des pannes}
              - {id: goulot, label: Les goulots d'abord}
    autopilot: préventif sur le goulot de chaque ligne, réparations dans l'ordre d'arrivée
    notions: [disponibilite, pannes_par_usure, maintenance_preventive, goulot]

