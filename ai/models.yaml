# Catalogue des modèles et des tâches des agents IA runtime (Ollama).
#
# RÈGLE : le code demande une TÂCHE (ex. "npc.dialogue"), jamais un modèle.
# Changer de modèle, de budget ou de température = modifier ce fichier (validé par les tests).
#
# Profil matériel actuel : RTX 3060 Laptop 6 Go VRAM / 16 Go RAM.
# => un seul modèle "main" (~5 Go) tient en VRAM ; Godot en 3D consomme aussi de la VRAM.
# => les petits modèles (nano, embed, decide-fast) peuvent cohabiter.
#
# Champs d'une tâche : model, fallback, output (text|json|decision|embedding),
# options Ollama (num_predict, temperature…), max_input_tokens, rag, cache, stream, think.
#
# num_ctx est FIXÉ PAR MODÈLE, jamais par tâche : mesuré sur ce poste, alterner 512 / 4096 sur
# qwen2.5:1.5b force un rechargement à chaque appel (~7 s au lieu de quelques centaines de ms).
# Le coût en tokens se pilote avec max_input_tokens (entrée) et num_predict (sortie).

version: 1
keep_alive: "10m"

models:
  # --- Décision : questions fermées (choice / noul / score), API /v1/systemone (format Jev) ---
  decide-fast:
    name: "tev1:0.8b"
    kind: decision
    vram_gb: 1.0
    required: false
    notes: >-
      Mesuré en français (ai/evals/player.intent.jsonl) : intention 93 %, injections 5/6 au seuil 0,7,
      ~0,1 s/message, 0,8 Go de VRAM : tient en mémoire à côté du modèle de dialogue. Exige Ollama >= 0.40.4.
      Jeu de réglage uniquement : sur des messages neufs (jeu de contrôle, 2026-10-28) il filtre peu d'injections
      variées et presque aucun hors-sujet hors liste (ai/evals/README.md).
  decide:
    name: "tev1:4b"
    kind: decision
    vram_gb: 4.6
    required: false
    notes: "Mesuré en français : intention 100 %, ~0,9 s, 4,6 Go de VRAM. Hors temps réel sur ce poste (revue, notation)."

  # --- Génération de texte ---
  nano:
    name: "qwen2.5:1.5b"
    kind: chat
    vram_gb: 1.2
    num_ctx: 4096
    notes: "Textes très courts : répliques d'ambiance, reformulation de requête RAG."
  small:
    name: "qwen2.5:3b"
    kind: chat
    vram_gb: 2.3
    num_ctx: 6144
    notes: >-
      Dialogues des agents PNJ (faits du moteur, mémoire, RAG). Candidat d'upgrade : qwen3.5:4b. Sert aussi,
      PROVISOIREMENT, aux tâches game.design.* (ADR 0008) : le modèle de conception sera tranché par l'éval de l'étape 11.
  main:
    name: "qwen2.5:7b"
    kind: chat
    vram_gb: 4.9
    num_ctx: 6144
    notes: >-
      Textes longs (débrief personnalisé). Les business games sont générés sans modèle depuis le
      2026-10-22 (paramètres, ADR 0006). Mesuré le 2026-10-22 (RTX 3060 6 Go, modèle seul en mémoire) :
      num_ctx 8192 -> 21 % sur CPU, 16 tok/s ; 6144 -> 18 % sur CPU, 21,5 tok/s. Candidat : qwen3.5:9b
      (6,6 Go : déborde davantage, acceptable pour la génération asynchrone, à mesurer).

  # --- Embeddings ---
  embed:
    name: "embeddinggemma"
    kind: embedding
    dims: 768 # = EMBED_DIM de backend/gmix/db/models.py (testé)
    vram_gb: 0.7
    query_prefix: "task: search result | query: "
    document_prefix: "title: {title} | text: "
    notes: "Multilingue, 2k tokens de contexte. Préfixes recommandés par Google pour EmbeddingGemma."

tasks:
  # --- Diagnostic -------------------------------------------------------------------------------
  system.ping:
    description: "Test de la chaîne IA (worker de diagnostic)."
    model: nano
    output: text
    options: { num_predict: 8, temperature: 0 }
    max_input_tokens: 100
  system.ping.decision:
    description: "Test du modèle de décision (repli : émulation par nano)."
    model: decide-fast
    fallback: nano
    output: decision

  # --- Agents en jeu (côté joueurs, latence visible) ---------------------------------------------
  player.intent:
    description: "Route le message d'un joueur : question métier, décision, social, hors-sujet, tentative d'injection."
    model: decide-fast
    fallback: nano
    output: decision
  npc.dialogue:
    description: >-
      Réplique courte d'un agent PNJ (une ou deux phrases) : informations essentielles calculées par le moteur,
      caractère de l'agent, mémoire des derniers échanges du lobby, extraits du corpus pour une question métier.
    model: small
    output: text
    options: { num_predict: 100, temperature: 0.6 }
    max_input_tokens: 3000
    rag: { top_k: 2, max_context_tokens: 500 }
  npc.bark:
    description: "Phrase d'ambiance courte d'un PNJ, sans RAG."
    model: nano
    output: text
    options: { num_predict: 40, temperature: 0.8 }
    max_input_tokens: 300
  rag.query_rewrite:
    description: "Reformule la question du joueur en requête autonome (résout « et pour ça ? »)."
    model: nano
    output: text
    cache: true
    options: { num_predict: 48, temperature: 0 }
    max_input_tokens: 600
  rag.embed:
    description: "Embeddings des passages (ingestion) et des requêtes (recherche)."
    model: embed
    output: embedding

  # --- Conception d'un business game par l'IA (ADR 0008) : un job = 3 appels, un seul modèle chargé -----------
  # Sortie JSON contrainte par un schéma construit depuis le pack (LLMService.structured), sans RAG ni tev1 :
  # les notions du pack tiennent dans le prompt. cache + graine : une reprise retrouve les appels déjà faits.
  # Le modèle (small = celui du dialogue, donc rien n'est délogé de la VRAM) est provisoire, avant l'éval de l'étape 11.
  # num_predict : plafond au-dessus de la taille maximale des schémas (testé par backend/tests/test_design.py).
  game.design.concept:
    description: "Conception du scénario et des mécaniques depuis la demande du formateur ; JSON contraint par un schéma construit depuis le pack, aucun chiffre libre."
    model: small
    fallback: main
    output: json
    cache: true
    options: { num_predict: 1500, temperature: 0.4 }
    max_input_tokens: 4500  # (29/10) + catalogue réseau (ADR 0009) ; 4500 + 1500 <= num_ctx 6144 (testé)
  game.design.cast:
    description: "Personnages du jeu (nom, caractère du pack, présentation) ; JSON contraint, aucun chiffre libre."
    model: small
    fallback: main
    output: json
    cache: true
    options: { num_predict: 1000, temperature: 0.6 }
    max_input_tokens: 3000
  game.design.journey:
    description: "Interface (panneaux et outils du pack), didacticiel et questions de débrief ; JSON contraint, aucun chiffre libre."
    model: small
    fallback: main
    output: json
    cache: true
    options: { num_predict: 1100, temperature: 0.4 }
    max_input_tokens: 3500

  # --- Conception de l'usine (ADR 0010, annexe §7) : un seul appel, paramètres de GameParams choisis dans le pack ---
  # Sortie JSON contrainte (énumérations du pack), brief filtré contre l'injection avant l'appel (gmix.llm.factory_design).
  # `small` : même modèle que npc.dialogue, rien n'est délogé de la VRAM. Plafond num_predict au-dessus du schéma maximal.
  factory.design:
    description: "Choix des paramètres de l'usine (secteur, départements, difficulté, réglages, aléas) depuis le brief du formateur ; JSON contraint par le pack, aucun chiffre libre."
    model: small
    fallback: main
    output: json
    cache: true
    options: { num_predict: 600, temperature: 0.3 }
    max_input_tokens: 2500

  # --- Évaluation et débrief -------------------------------------------------------------------
  answer.grading:
    description: "Note la réponse d'un joueur à une question de débrief selon une grille (score)."
    model: decide
    fallback: small
    output: decision
  debrief.feedback:
    description: "Retour personnalisé de fin de partie à partir des KPI et des décisions, avec sources."
    model: main
    output: text
    options: { num_predict: 700, temperature: 0.4 }
    max_input_tokens: 5000
    rag: { top_k: 4, max_context_tokens: 1500 }
