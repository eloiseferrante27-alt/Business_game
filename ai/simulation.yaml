# Contenu des business games simulés (docs/decisions/0006). Le formateur ne rédige rien : il choisit des
# paramètres (secteur, modules, agents, caractère, difficulté, durée, aléas) et gmix.game.generation assemble
# un jeu cohérent à partir de ce fichier. Les règles chiffrées sont dans gmix.game.engine.
#
# Repris du jeu de référence github.com/eloiseferrante27-alt/Business_game (commit e0cd56e, dépôt sans
# licence : accord de son autrice à confirmer avant diffusion) : principe hebdomadaire, profils de difficulté,
# noms et villes des fournisseurs, produits du secteur « industrie », noms des ouvriers (Maya, Idriss, Léa,
# Noah), aléas « perturbation maritime » et « hausse des matières ».
#
# Noms d'entreprises, de fournisseurs et de clients : fictifs.

version: 1

difficulties:
  decouverte:
    label: Découverte
    detail: stocks et production renforcés, fournisseurs fiables
    stock_weeks: 2.5          # stocks de départ, en semaines de consommation
    trs: 90                   # taux de rendement synthétique de départ des lignes (%)
    reliability_shift: 4      # points de fiabilité ajoutés aux fournisseurs
    defect_rate: 0.02
    demand_noise: 0.05
    cash_weeks: 6             # trésorerie de départ, en semaines d'achats
  equilibre:
    label: Équilibré
    detail: conditions standard
    stock_weeks: 1.8
    trs: 85
    reliability_shift: 0
    defect_rate: 0.03
    demand_noise: 0.08
    cash_weeks: 4
  expert:
    label: Expert
    detail: stocks, fiabilité et rendement réduits
    stock_weeks: 1.2
    trs: 76
    reliability_shift: -8
    defect_rate: 0.05
    demand_noise: 0.12
    cash_weeks: 2.5

# Réglages que la conception par l'IA peut choisir (ADR 0008, annexe §2) : une clé de profil prend la valeur d'un
# autre profil de `difficulties`, jamais un nombre nouveau. `teaches` : notions que le réglage rend visibles.
# Provenance de chaque valeur : `values` ci-dessous.
tunables:
  stock_weeks: {label: Stocks de départ, teaches: [stock_de_securite, rupture_de_stock, cout_de_possession]}
  trs: {label: Rendement de départ des lignes (TRS), teaches: [capacite_et_trs, maintenance_preventive]}
  reliability_shift: {label: Fiabilité des fournisseurs, teaches: [delai_et_fiabilite, stock_de_securite]}
  defect_rate: {label: Taux de défauts, teaches: [qualite_a_la_source]}
  demand_noise: {label: Variabilité de la demande, teaches: [stock_de_securite, planification_mrp]}
  cash_weeks: {label: Trésorerie de départ, teaches: [cout_de_possession, rotation_des_stocks]}

# Provenance des valeurs des profils (même format que ai/packs/usine.yaml) : `calibre` = choisi pour la jouabilité
# (le pilote automatique atteint les objectifs en découverte et peine en expert, docs/game-design.md), la note dit
# pourquoi. Profils de difficulté repris du jeu de référence (ADR 0006) ; ordres de grandeur indicatifs, non sourcés.
values:
  stock.semaines_initiales: {status: calibre, note: "difficulties.stock_weeks (2,5 ; 1,8 ; 1,2 semaines de demande) : stock de départ de chaque produit et de son composant (gmix.game.generation)."}
  ligne.trs_initial: {status: calibre, note: "difficulties.trs (90 ; 85 ; 76 %), ± 2 points tirés par ligne, borné à 50-96 ; la capacité vaut demande x 1,12 / 0,85, donc 76 % couvre tout juste la demande. La fiche wikipedia-en-overall-equipment-effectiveness réfute une cible universelle de 85 %."}
  fournisseur.ecart_fiabilite: {status: calibre, note: "difficulties.reliability_shift (+4 ; 0 ; -8 points) ajouté à la fiabilité des trois profils (97, 92, 84 %), borné à 50-99."}
  qualite.taux_defauts: {status: calibre, note: "difficulties.defect_rate (2 ; 3 ; 5 % des unités produites), avant contrôle ; l'aléa lot_defectueux en ajoute 4 points."}
  demande.bruit: {status: calibre, note: "difficulties.demand_noise (5 ; 8 ; 12 %) : écart tiré uniformément autour de la demande de chaque semaine (gmix.game.engine._demand)."}
  finance.tresorerie_initiale_semaines: {status: calibre, note: "difficulties.cash_weeks (6 ; 4 ; 2,5 semaines d'achats de composants)."}

targets:
  otif: 95            # % de livraisons à l'heure et complètes
  trs: 85             # % moyen des lignes
  stockouts: 0        # références en rupture la dernière semaine
  cash_share: 0.6     # trésorerie finale >= départ + 60 % du gain obtenu par le pilote automatique

# Profils d'offre fournisseur : chaque composant a trois fournisseurs, du plus réactif au moins cher.
# min_weeks : commande minimale exprimée en semaines de consommation du composant.
supplier_profiles:
  - {label: rapide, lead_time: 1, reliability: 97, cost: 1.15, min_weeks: 0.5}
  - {label: standard, lead_time: 2, reliability: 92, cost: 1.0, min_weeks: 1}
  - {label: economique, lead_time: 4, reliability: 84, cost: 0.82, min_weeks: 2.5}

# Économie commune à tous les secteurs (taux appliqués aux coûts et prix de chaque produit).
economy:
  holding_rate_week: 0.0048     # coût de possession : 25 % par an de la valeur du stock
  maintenance_rate: {aucune: 0.0, preventive: 0.10, renforcee: 0.25}   # x capacité x coût de transformation
  trs_drift: {aucune: -2.5, preventive: 0.5, renforcee: 2.0}           # points de TRS par semaine
  control_cost_rate: 0.08       # coût d'un contrôle, en part du coût de transformation de l'unité
  interest_rate_week: 0.004     # agios sur trésorerie négative
  price_elasticity: 1.5
  transport:
    economique: {on_time: 0.90, cost_rate: 0.02}
    standard: {on_time: 0.97, cost_rate: 0.035}
    express: {on_time: 0.995, cost_rate: 0.07}

modules:
  approvisionnement:
    title: Approvisionnement
    description: Commander les composants aux fournisseurs (délai, fiabilité, prix) avant que les lignes ne s'arrêtent.
    role: {id: acheteur, title: Acheteur·se, mission: Commander les composants au bon moment et au bon fournisseur}
    stations: [quai_reception, rack_composant]
    agent: {name: Noah, job: Réceptionnaire au quai, character: char_worker_m, zone: quai_reception,
            tasks: [réceptionner les livraisons des fournisseurs, suivre les commandes en cours, signaler les composants sous leur point de commande]}
    actions:
      - id: commander
        label: Passer une commande
        fields:
          - {id: offer, label: Composant et fournisseur, type: choice, source: offers}
          - {id: quantity, label: Quantité, type: int, min: 50, max: 6000, step: 50, default: 500}
    autopilot: point de commande recalculé chaque semaine, fournisseur standard
    notions: [point_de_commande, stock_de_securite, delai_et_fiabilite]
  production:
    title: Production
    description: Fixer la quantité à fabriquer sur chaque ligne selon la demande, les stocks et les composants.
    role: {id: responsable_production, title: Responsable de production, mission: Planifier les lignes pour servir la demande sans surstocker}
    stations: [ligne]
    agent: {name: Idriss, job: Chef d'atelier, character: char_worker_m, zone: lignes_avant,
            tasks: [faire tourner les lignes, adapter le plan de production, prévenir quand un composant manque]}
    actions:
      - id: planifier
        label: Planifier une ligne
        fields:
          - {id: line, label: Ligne, type: choice, source: lines}
          - {id: quantity, label: Quantité à produire cette semaine, type: int, min: 0, max: 3000, step: 10, default: 200}
    autopilot: chaque ligne vise deux semaines de couverture
    notions: [planification_mrp, capacite_et_trs]
  maintenance:
    title: Maintenance
    description: Entretenir les lignes pour garder leur rendement et éviter les pannes.
    role: {id: responsable_maintenance, title: Responsable maintenance, mission: Garder le TRS des lignes au-dessus de l'objectif}
    stations: [ligne]
    agent: {name: Karim, job: Technicien de maintenance, character: char_worker_m, zone: lignes_arriere,
            tasks: [entretenir les machines, surveiller l'usure des lignes, intervenir en cas de panne]}
    actions:
      - id: entretenir
        label: Choisir l'entretien d'une ligne
        fields:
          - {id: line, label: Ligne, type: choice, source: lines}
          - id: level
            label: Niveau d'entretien
            type: choice
            options:
              - {id: aucune, label: "Aucun : pas de coût, la ligne s'use"}
              - {id: preventive, label: "Préventif : coût modéré, rendement stable"}
              - {id: renforcee, label: "Renforcé : coût élevé, rendement en hausse"}
    autopilot: entretien préventif sur toutes les lignes
    notions: [capacite_et_trs, maintenance_preventive]
  qualite:
    title: Qualité
    description: Régler le contrôle avant expédition pour éviter d'envoyer des défauts aux clients.
    role: {id: responsable_qualite, title: Responsable qualité, mission: Limiter les retours clients au coût de contrôle le plus juste}
    stations: [poste_qualite]
    agent: {name: Léa, job: Contrôleuse qualité, character: char_worker_f, zone: qualite,
            tasks: [contrôler les lots en sortie de ligne, suivre les retours clients, alerter sur les défauts]}
    actions:
      - id: controler
        label: Régler le contrôle avant expédition
        fields:
          - id: rate
            label: Part des lots contrôlés
            type: choice
            options:
              - {id: "0", label: "Aucun contrôle : pas de coût, tous les défauts partent chez le client"}
              - {id: "50", label: "Un lot sur deux : la moitié des défauts est arrêtée"}
              - {id: "100", label: "Tous les lots : aucun défaut ne sort, coût maximal"}
    autopilot: un lot sur deux contrôlé
    notions: [qualite_a_la_source]
  commercial:
    title: Commercial
    description: "Fixer les prix de vente : un prix bas attire la demande, mais il faut pouvoir la servir."
    role: {id: commercial, title: Commercial·e, mission: Développer le chiffre d'affaires sans provoquer de ruptures}
    stations: [bureau]
    agent: {name: Hugo, job: Responsable commercial, character: char_manager_m, zone: bureau,
            tasks: [suivre la demande de l'enseigne, préparer les prévisions, négocier les prix]}
    actions:
      - id: fixer_prix
        label: Fixer un prix de vente
        fields:
          - {id: product, label: Produit, type: choice, source: products}
          - id: price
            label: Niveau de prix
            type: choice
            options:
              - {id: "0.9", label: "Promotion : prix -10 %, demande en hausse"}
              - {id: "1.0", label: "Prix catalogue"}
              - {id: "1.1", label: "Prix +10 %, demande en baisse"}
    autopilot: prix catalogue
    notions: [prix_et_demande, rupture_de_stock]
  transport:
    title: Transport
    description: Choisir le mode de livraison des magasins, entre coût et ponctualité.
    role: {id: responsable_transport, title: Responsable transport, mission: Livrer à l'heure au juste coût}
    stations: [quai_expedition]
    agent: {name: Maya, job: Cariste et expéditions, character: char_worker_f, zone: quai_expedition,
            tasks: [préparer les expéditions, charger les camions, suivre la ponctualité des livraisons]}
    actions:
      - id: choisir_mode
        label: Choisir le mode de transport
        fields:
          - id: mode
            label: Mode de transport
            type: choice
            options:
              - {id: economique, label: "Groupage : le moins cher, 90 % à l'heure"}
              - {id: standard, label: "Messagerie : 97 % à l'heure"}
              - {id: express, label: "Express : le plus cher, 99,5 % à l'heure"}
    autopilot: messagerie standard
    notions: [otif, transport_cout_delai]
  finance:
    title: Finance
    description: "Piloter la trésorerie : sans découvert, une commande qui la rendrait négative est refusée."
    role: {id: controleur_gestion, title: Contrôleur·se de gestion, mission: Garder une trésorerie positive sans freiner l'activité}
    stations: [bureau]
    agent: {name: Sarah, job: Contrôleuse de gestion, character: char_office_f, zone: bureau,
            tasks: [suivre la trésorerie, chiffrer le coût des stocks, valider les dépenses]}
    actions:
      - id: decouvert
        label: Négocier le découvert bancaire
        fields:
          - id: limit
            label: Découvert autorisé
            type: choice
            options:
              - {id: "0", label: "Aucun : la trésorerie ne peut pas passer sous zéro"}
              - {id: "20000", label: "20 000 € : intérêts de 0,4 % par semaine sur le solde négatif"}
              - {id: "50000", label: "50 000 € : intérêts de 0,4 % par semaine sur le solde négatif"}
    autopilot: pas de contrainte de trésorerie (le solde peut être négatif, il est seulement affiché)
    notions: [cout_de_possession, rotation_des_stocks]

# Agents qui ne pilotent pas de module : ils apportent la voix du client, du fournisseur ou de la direction.
extra_agents:
  client:
    title: Acheteuse de l'enseigne
    description: Réagit au service reçu (ruptures, retards, retours) et annonce les opérations commerciales.
    name: Mme Durand
    job: Acheteuse de l'enseigne cliente
    character: char_manager_f
    zone: quai_expedition
    tasks: [suivre le taux de service de son fournisseur, annoncer les promotions de l'enseigne, se plaindre des ruptures]
    notions: [otif, rupture_de_stock]
  fournisseur:
    title: Commercial fournisseur
    description: Prévient des retards et des hausses de prix à venir chez les fournisseurs.
    name: Paul
    job: Commercial d'un fournisseur
    character: char_driver_m
    zone: quai_reception
    tasks: [prévenir des retards de livraison, annoncer les hausses de prix, proposer des quantités]
    notions: [delai_et_fiabilite]
  direction:
    title: Direction du site
    description: Rappelle les objectifs, les semaines restantes et les écarts à combler.
    name: Claire
    job: Directrice du site
    character: char_manager_f
    zone: bureau
    tasks: [fixer les objectifs, suivre les indicateurs, arbitrer les priorités]
    notions: [otif, capacite_et_trs]

personalities:
  bienveillant:
    label: Bienveillant
    traits: chaleureux, encourageant, patient
    style: tutoie, rassure, glisse parfois un conseil
    prefix: "Petit point :"
  exigeant:
    label: Exigeant
    traits: direct, attaché aux résultats, peu patient avec les erreurs
    style: phrases sèches, va droit au chiffre
    prefix: "Il faut agir :"
  presse:
    label: Pressé
    traits: toujours entre deux tâches, efficace
    style: très bref, presque télégraphique
    prefix: "Vite :"
  methodique:
    label: Méthodique
    traits: rigoureux, aime les chiffres exacts et les procédures
    style: précis, donne les étapes dans l'ordre
    prefix: "À noter :"
  sceptique:
    label: Sceptique
    traits: prudent, se méfie des solutions miracles
    style: pointe les risques, pose une question en retour
    prefix: "Attention :"

agent_tones:
  bienveillant: {label: Bienveillants, personalities: [bienveillant, methodique]}
  mixte: {label: Caractères variés, personalities: [methodique, exigeant, bienveillant, presse, sceptique]}
  exigeant: {label: Exigeants, personalities: [exigeant, sceptique, presse]}

events:
  perturbation_maritime:
    title: Perturbation maritime
    description: Des retards de navires désorganisent les approvisionnements.
    weight: 2
    effects: {delay_risk: 0.25, demand: 1.05}
    modules: [approvisionnement]
  hausse_matieres:
    title: Hausse des matières premières
    description: Les prix d'achat des composants augmentent de 10 %.
    weight: 2
    effects: {cost: 1.10}
    modules: [approvisionnement, finance]
  operation_promotionnelle:
    title: Opération promotionnelle de l'enseigne
    description: "L'enseigne met vos produits en avant : la demande grimpe de 25 % sur la semaine."
    weight: 2
    effects: {demand: 1.25}
    modules: [commercial, production]
  creux_de_demande:
    title: Creux de demande
    description: "Les magasins vendent moins cette semaine : la demande baisse de 20 %."
    weight: 1
    effects: {demand: 0.8}
    modules: [commercial, production]
  panne_ligne:
    title: Panne sur une ligne
    description: Une ligne tombe en panne et ne tourne qu'à 40 % de sa capacité réelle.
    weight: 2
    effects: {breakdown: 1}
    modules: [maintenance, production]
  greve_transport:
    title: Grève des transporteurs
    description: "Les tournées sont perturbées : 15 points de ponctualité en moins."
    weight: 1
    effects: {on_time: -0.15}
    modules: [transport]
  lot_defectueux:
    title: Lot de composants défectueux
    description: Un lot reçu génère 4 points de défauts en plus sur la production.
    weight: 1
    effects: {defects: 0.04}
    modules: [qualite]

events_levels:
  aucun: {label: Aucun aléa, probability: 0}
  rares: {label: Aléas rares, probability: 0.25}
  frequents: {label: Aléas fréquents, probability: 0.5}

# Notions transmises par les agents et rappelées au débrief. `source` : fiche du corpus knowledge/supply-chain
# (la citation exacte est lue dans son en-tête « > Source : ») ou `citation` écrite ici. `indicators` (ADR 0008) :
# indicateurs du débrief (otif, trs, stockouts, cash) où la notion se voit, d'après les règles de gmix.game.engine
# (OTIF = bons servis / demande x ponctualité du transport ; coûts de maintenance, contrôle, possession dans cash).
notions:
  point_de_commande:
    title: Point de commande
    text: On recommande quand le stock, commandes en cours comprises, passe sous le point de commande, égal à la consommation prévue pendant le délai d'approvisionnement plus le stock de sécurité.
    source: wikipedia-en-reorder-point
    indicators: [stockouts, otif]
  stock_de_securite:
    title: Stock de sécurité
    text: Le stock de sécurité couvre l'incertitude de la demande et des délais ; plus ils sont imprévisibles et plus le service visé est élevé, plus il doit être important.
    source: wikipedia-fr-stock-de-securite
    indicators: [stockouts, otif]
  delai_et_fiabilite:
    title: Délai et fiabilité des fournisseurs
    text: Des délais de réapprovisionnement longs ou aléatoires obligent à commander plus tôt et à garder davantage de stock de sécurité ; le prix n'est qu'un critère de choix parmi d'autres.
    source: wikipedia-fr-stock-de-securite
    indicators: [stockouts, otif]
  planification_mrp:
    title: Calcul des besoins (MRP)
    text: Le calcul des besoins part de la demande prévue pour planifier la production et les composants nécessaires ; une ligne sans composant s'arrête.
    source: wikipedia-en-material-requirements-planning
    indicators: [stockouts, otif]
  capacite_et_trs:
    title: Taux de rendement synthétique (TRS)
    text: Le TRS (OEE en anglais) rapporte la production de pièces bonnes à ce que la ligne produirait sans arrêt, à pleine cadence ; pannes, ralentissements et rebuts le font baisser, et la capacité réelle avec lui.
    source: wikipedia-en-overall-equipment-effectiveness   # NF E60-182 : norme payante non lue, retirée (28/10/2026)
    indicators: [trs, otif]
  maintenance_preventive:
    title: Maintenance préventive
    text: Le lean classe les pannes parmi les gaspillages ; entretenir avant la panne a un coût, mais préserve la capacité réelle des lignes.
    source: wikipedia-fr-lean-production
    indicators: [trs, cash]
  qualite_a_la_source:
    title: Qualité à la source
    text: Le lean vise à arrêter la production au premier défaut (andon) et à intégrer la qualité dès la conception ; un défaut non détecté part chez le client et revient en retour.
    source: wikipedia-fr-lean-production
    indicators: [otif, cash]
  prix_et_demande:
    title: Prix, promotions et effet coup de fouet
    text: Les variations de prix et les promotions font varier la demande et amplifient l'effet coup de fouet (bullwhip) le long de la chaîne logistique.
    source: wikipedia-en-bullwhip-effect
    indicators: [stockouts, cash]
  rupture_de_stock:
    title: Rupture de stock
    text: Une rupture rend la référence indisponible à la vente ; la vente est perdue et le taux de service baisse.
    source: wikipedia-fr-rupture-de-stock
    indicators: [stockouts, otif]
  otif:
    title: OTIF (à l'heure et complet)
    text: Le modèle SCOR mesure la performance de livraison comme la part des produits livrés à temps et en totalité à la date promise.
    source: wikipedia-en-supply-chain-operations-reference
    indicators: [otif]
  transport_cout_delai:
    title: Transport, coût et délai
    text: La logistique externe (transport, livraison) doit maîtriser à la fois les coûts et les délais ; un transport plus rapide et plus sûr coûte plus cher.
    source: wikipedia-fr-logistique
    indicators: [otif, cash]
  cout_de_possession:
    title: Coût de possession du stock
    text: Garder du stock coûte, proportionnellement au stock moyen ; la formule de Wilson met ce coût en balance avec le coût de passation des commandes.
    source: wikipedia-fr-formule-de-wilson
    indicators: [cash]
  rotation_des_stocks:
    title: Rotation des stocks
    text: La rotation des stocks (coût des ventes divisé par le stock moyen) montre si l'entreprise garde trop de stock par rapport à ses ventes.
    source: wikipedia-en-inventory-turnover
    indicators: [cash]

# Barre d'actions (ADR 0008, annexe §1 `Tool`, §2) : une entrée par action de module au plus, touche = rang + 1.
# Tableau de bord et aide d'abord, pour garder les mêmes touches dans toutes les parties ; caméra (vue Sims) en
# dernier. Libellés : interface, aucune affirmation métier.
tools:
  - {id: tableau, label: Tableau de bord, kind: tableau_de_bord}
  - {id: aide, label: Aide, kind: aide}
  - {id: commande, label: Commander, kind: action, action_id: commander}
  - {id: plan, label: Planifier, kind: action, action_id: planifier}
  - {id: entretien, label: Entretien, kind: action, action_id: entretenir}
  - {id: controle, label: Contrôle, kind: action, action_id: controler}
  - {id: prix, label: Prix de vente, kind: action, action_id: fixer_prix}
  - {id: transport, label: Transport, kind: action, action_id: choisir_mode}
  - {id: decouvert, label: Découvert, kind: action, action_id: decouvert}
  - {id: camera, label: Caméra, kind: camera}

# Didacticiel par défaut (jeu par paramètres, repli de la section journey). Sans chiffre. Ancres présentes dans
# toute partie atelier (tous les postes sont posés, gmix.game.generation._layout). Provenance des affirmations :
# kpis du moteur (engine.INDICATORS) ; « une ligne sans composant s'arrête » = notion planification_mrp ; « une
# ligne mal entretenue perd du rendement » = notions capacite_et_trs et maintenance_preventive ; contenu du
# tableau de bord = godot GameText.dashboard_bbcode ; postes sans module = « géré automatiquement » (hud.gd).
tutorial:
  - {id: indicateurs, title: Vos indicateurs, anchor: "station:ecran_kpi",
     text: "L'écran des indicateurs montre l'OTIF, le TRS, les ruptures et la trésorerie face à leur cible, semaine après semaine."}
  - {id: flux, title: Le flux de l'atelier, anchor: "station:quai_reception",
     text: "Les composants arrivent au quai de réception, passent sur les lignes, puis repartent en produits finis par le quai d'expédition."}
  - {id: lignes, title: Les lignes, anchor: "station:ligne",
     text: "Une ligne sans composant s'arrête, une ligne mal entretenue perd du rendement : surveillez les stocks et le TRS."}
