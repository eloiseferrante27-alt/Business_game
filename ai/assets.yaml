# Catalogue des assets 3D prédéfinis : source unique de vérité. Responsable : agent assets-3d.
#
# L'IA ne génère jamais de géométrie : elle choisit des ids de ce catalogue (tâche game.asset_mapping) et ne règle
# que les `variants` déclarées (texte d'enseigne, niveau de remplissage…). La `description` est vectorisée pour
# présélectionner les candidats d'une zone.
#
# footprint : taille réelle visée en mètres (w largeur X, d profondeur Z, h hauteur Y). Le modèle source est mis à
#             l'échelle uniformément pour que sa dimension `fit` (h, w, d ou max = plus grande dimension au sol)
#             égale celle de l'emprise ; les autres dimensions suivent ses proportions.
# source    : pack + fichier GLB importé, ou pack `gmix` sans fichier = scène procédurale écrite à la main.
# status    : importe (défaut : modèle importé ou scène construite) ; a_sourcer = déclaré par son id (génération, packs)
#             mais ni importé ni fabriqué : absent de godot/assets/catalog.json, de CREDITS.md et de la table assets.
#             Passer à importe quand la scène existe (le test_assets vérifie alors sa présence).
# Scène Godot (convention) : res://assets/<category>/<id>/<id>.tscn
# Couleurs : palette commune godot/assets/procedural/palette.gd (constantes pour les assets procéduraux ; les modèles
#            de packs sont ramenés dans la palette à l'exécution par Palette.restyle, sans toucher aux fichiers importés).
#
# Chaîne : python -m gmix.tools.assets import <dossier des zips extraits> ; python -m gmix.tools.assets export ;
#          Godot --headless --script res://tools/build_asset_scenes.gd ; python -m gmix.tools.assets sync-db

version: 2

packs:
  kenney-factory-kit: { title: "Kenney Factory Kit 3.0", url: "https://kenney.nl/assets/factory-kit", license: "CC0 1.0", download_dir: factory-kit, models_dir: "Models/GLB format" }
  kenney-city-kit-industrial: { title: "Kenney City Kit (Industrial) 2.0", url: "https://kenney.nl/assets/city-kit-industrial", license: "CC0 1.0", download_dir: city-kit-industrial, models_dir: "Models/GLB format" }
  kenney-city-kit-commercial: { title: "Kenney City Kit (Commercial) 2.1", url: "https://kenney.nl/assets/city-kit-commercial", license: "CC0 1.0", download_dir: city-kit-commercial, models_dir: "Models/GLB format" }
  kenney-city-kit-roads: { title: "Kenney City Kit (Roads)", url: "https://kenney.nl/assets/city-kit-roads", license: "CC0 1.0", download_dir: city-kit-roads, models_dir: "Models/GLB format" }
  kenney-car-kit: { title: "Kenney Car Kit", url: "https://kenney.nl/assets/car-kit", license: "CC0 1.0", download_dir: car-kit, models_dir: "Models/GLB format" }
  kenney-furniture-kit: { title: "Kenney Furniture Kit", url: "https://kenney.nl/assets/furniture-kit", license: "CC0 1.0", download_dir: furniture-kit, models_dir: "Models/GLTF format" }
  kenney-mini-characters: { title: "Kenney Mini Characters (animés)", url: "https://kenney.nl/assets/mini-characters", license: "CC0 1.0", download_dir: mini-characters, models_dir: "Models/GLB format" }
  kenney-nature-kit: { title: "Kenney Nature Kit", url: "https://kenney.nl/assets/nature-kit", license: "CC0 1.0", download_dir: nature-kit, models_dir: "Models/GLTF format" }
  gmix: { title: "Assets G-mix (scènes Godot procédurales)", url: "godot/assets/procedural", license: "propriété du projet" }

# Polices du thème d'interface (godot/assets/fonts/), reprises de la direction artistique du jeu de référence.
# Tiers sous SIL OFL 1.1 : le texte de licence (OFL-*.txt) accompagne les fichiers. Lues par `export` (CREDITS.md) et
# vérifiées par test_assets. Manrope.ttf et DMSans.ttf sont variables : Manrope par défaut en graisse 200, le gras
# passe par les FontVariation (*.tres) ; DMMono est statique (Regular / Medium).
fonts:
  - { name: Manrope, role: titres, license: "SIL OFL 1.1", license_file: OFL-Manrope.txt, url: "https://github.com/google/fonts/tree/main/ofl/manrope",
      files: [Manrope.ttf, ManropeBold.tres, ManropeExtraBold.tres] }
  - { name: DM Sans, role: corps de texte, license: "SIL OFL 1.1", license_file: OFL-DMSans.txt, url: "https://github.com/google/fonts/tree/main/ofl/dmsans",
      files: [DMSans.ttf, DMSansBold.tres] }
  - { name: DM Mono, role: étiquettes, license: "SIL OFL 1.1", license_file: OFL-DMMono.txt, url: "https://github.com/google/fonts/tree/main/ofl/dmmono",
      files: [DMMono.ttf, DMMonoMedium.ttf] }

