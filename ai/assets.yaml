  # --- Monde usine (ADR 0007, annexe §5) : tranche 1 fabriquée (étape 5b), tranches 2 et 3 en a_sourcer -------------
  # Les 14 assets sont fabriqués en procédural (pack gmix, GDScript + Mesher, collision StaticBody3D sauf mention) : aucun
  # modèle libre vérifié (CC0) n'existe pour un transpalette, une filmeuse ou une table d'attente avec niveau animé.
  # Aucun ne dérive de prop_production_line ni de prop_site_office (jeu de référence sans licence, exclus par l'ADR).
  # Les noms de variantes sont les noms français des propriétés GDScript lues par world.gd (annexe : state, title...).
  # Emprises = taille mesurée de la scène finie (le plan en U de l'annexe en dépend : lignes au pas de 4 m, 4 machines
  # et 4 tables en 22 m, quai de 6 m à z = 15). Tranche 1 : 11 assets ; tranche 2 : 2 ; tranche 3 : 1.
  # Navigation : un asset est un obstacle s'il contient un CollisionObject3D (StaticBody3D « Collision »). prop_floor_zone
  # n'en a aucun ; prop_dock_door n'a que ses deux montants (l'ouverture de 2,7 m n'est pas un obstacle).
  # Rendu : un maillage fusionné par asset (Mesher.Batch) ; seuls les éléments animés (voyants, bacs, tas) ont le leur.
  #
  # Fabriqué sur base libre : scène gmix qui instancie machine.glb (kenney-factory-kit, CC0, déjà importé pour
  # prop_cnc_machine, donc déjà crédité) à l'échelle 1,4 (tunnel ouvert le long de X, fenêtre de contrôle sur +Z), avec
  # une colonne lumineuse sur le toit. Variante etat : arret, marche, pause, reglage, panne, attente_matiere, sortie_pleine.
  - { id: prop_machine, name: Machine de ligne (poste d'opération), category: industrial, fit: d, footprint: { w: 2, d: 2.5, h: 2.3 }, variants: [titre, etat],
      tags: [machine, poste, operation, ligne, serie, etat, panne, goulot, voyant, usine],
      description: "Machine capotée d'un poste d'opération en série (M1 à M4), surmontée d'une colonne d'état colorée (marche, pause, réglage, panne, manque de matière, sortie pleine, éteinte à l'arrêt) et de l'étiquette du poste : les états affichés sont ceux de la simulation.",
      source: { pack: gmix } }
  # Table d'attente entre deux machines : convoyeur à rouleaux basse (plateau à 0,48 m, comme l'ouverture des machines),
  # bacs de pièces en nombre proportionnel à niveau_remplissage (0 à 1, borné visuellement à 12 bacs), capacite = places
  # de la table (étiquette « n / capacité »).
  - { id: prop_buffer_table, name: Table d'attente (tampon), category: industrial, fit: w, footprint: { w: 2, d: 1, h: 0.65 }, variants: [niveau_remplissage, capacite],
      tags: [table_attente, tampon, encours, file_attente, entre_machines, stock_intermediaire, pieces],
      description: "Table d'attente à rouleaux placée entre deux machines d'une ligne : les pièces en cours y patientent, et le nombre de bacs posés dessus montre son remplissage (pleine : la machine amont s'arrête ; vide : la machine aval attend).",
      source: { pack: gmix } }
  # Porte sectionnelle de 3 m (relevée) ; deux portes côte à côte couvrent la tranche de 6 m de l'annexe (x de -3 à 3,
  # z = 15) : deux passages de 2,7 m séparés par un montant commun de 0,3 m. Pas de collision dans l'ouverture (montants
  # et butoirs seulement). Variante etat : libre (feu vert), occupe (feu rouge). Façade +Z = côté camions.
  - { id: prop_dock_door, name: Porte de quai, category: industrial, fit: w, footprint: { w: 3, d: 0.5, h: 3.6 }, variants: [etat],
      tags: [quai, porte, porte_sectionnelle, reception, expedition, camion, chargement, feu],
      description: "Porte de quai sectionnelle de 3 m avec butoirs et un feu libre ou occupé : l'ouverture par laquelle les camions du fournisseur et du client déchargent et chargent les palettes.",
      source: { pack: gmix } }
  # Marquage plat sans collision (h = 0,02 m) : ne compte pas comme obstacle. Variantes : titre (étiquette au sol), couleur,
