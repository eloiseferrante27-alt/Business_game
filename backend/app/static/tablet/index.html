<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>G-MIX — Tablette de pilotage</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
  <link rel="stylesheet" href="/static/tablet/game.css">
  <script defer src="/static/tablet/live-api.js"></script>
  <script defer src="/static/tablet/spreadsheet.js"></script>
  <script defer src="/static/tablet/app.js"></script>
</head>
<body>
  <div id="toast" class="toast" role="alert" aria-live="assertive" hidden></div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <div id="app" class="app">
    <header class="topbar" id="topbar"></header>
    <nav class="dock" id="dock" aria-label="Menu de la tablette"></nav>
    <nav class="rail" id="rail" aria-label="Départements"></nav>
    <main class="stage" id="stage" tabindex="-1">
      <div class="loading"><span class="logo-g">G</span><p>Connexion à l’usine…</p></div>
    </main>
  </div>
  <div id="modal" class="modal-fond" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
      <button class="modal-fermer" type="button" data-action="close-modal" aria-label="Fermer">×</button>
      <div id="modal-corps"></div>
    </section>
  </div>
  <noscript>La tablette G-MIX nécessite JavaScript.</noscript>
</body>
</html>
