# Uses the already authenticated local CLIs, not API keys or Higgsfield.
base_branch = "contribution_amine"
max_parallel = 2
timeout_seconds = 1800
worktree_directory = "../business_game-worktrees/tasks"

[agents.codex]
command = "codex"
role = "Coordination, configuration, moteur, API, tests et revue du travail Kimi"
# Empty means preserve the user's configured Codex model.
model = ""
allowed_roots = ["backend/", "config/", "scripts/", "tests/", "docs/", "requirements.txt", "AGENTS.md", ".agents/"]

[agents.kimi]
command = "kimi"
role = "Interface tablette et outils, après le moteur correspondant ou un contrat API explicite"
model = "kimi-code/k3.1-pro"
profile = ".agents/agents/gmix-ui.md"
allowed_roots = ["backend/app/static/", "backend/tests/", "tests/", "docs/", "AGENTS.md"]

[review]
agent = "codex"
timeout_seconds = 600

[checks]
pytest = ["{python}", "-m", "pytest", "-q"]
