; Configuration du client Godot (lue par l'autoload AppConfig).
; Surcharge locale sans modifier le projet : user://client.cfg
; (Windows : %APPDATA%\Godot\app_userdata\G-mix Open World\client.cfg)
; Export : ajouter *.cfg au filtre "fichiers non-ressources à exporter".

[backend]

api_base_url="http://127.0.0.1:8000"
ws_url="ws://127.0.0.1:8000/ws"
request_timeout_s=15.0
